":"110、112（換湯不換藥）","question":"依據資通安全責任等級分級辦法，下列何者正確？","options":["業務涉及全國性民眾服務或跨特定非公務機關共用性資通系統之維運 → A 級","業務涉及公務機關捐助、資助或研發之國家核心科技資訊之安全維護及管理 → B 級","維運自行或委外設置、開發且具權限區分及管理功能之資通系統 → A 級","無資通系統但提供資通服務 → E 級"],"answer":"B","explanation":"國家核心科技 / 敏感科學技術 → B 級。A 錯：「跨特定非公務機關」應為跨「公務機關」。C 錯：= C 級。D 錯：E 級 = 無系統且未提供服務。\n\n💡 解題提示：110 年中級考「敏感科學技術」、112 年初級考「國家核心科技」，關鍵字不同但答案都是 B 級。"},{"id":"p4-q08","source":"part4 資安法模擬試題","chapter":"C. 責任等級分級","type":"single","year":"113","question":"某 A 級公務機關（辦理全國全民健康保險業務），其資安承辦窗口所實施之作為，下列何項正確？","options":["每年辦理一次內部資通安全稽核","每二年辦理一次資通安全健診活動","資通安全專職人員配置四人","非核心資通系統導入 ISO 27001"],"answer":"C","explanation":"A 級專職 = 4 人。A 錯（A 級稽核 2 次/年）、B 錯（每年 1 次）、D 錯（核心系統才需導入）。\n\n💡 解題提示：A 級數字：專職 4 人、稽核 2 次/年、弱掃 2 次/年、滲透 1 次/年、健診 1 次/年"},{"id":"p4-q09","source":"part4 資安法模擬試題","chapter":"D. 事件分級","type":"single","year":"114","question":"某特定非公務機關判別某一非核心資通系統之資訊遭受輕微竄改，該事件之嚴重等級為？","options":["第一級","第二級","第三級","第四級"],"answer":"A","explanation":"非核心 + 輕微 = 第一級。（第一級：非核心/輕微、第二級：核心或非核心/一般、第三級：核心/嚴重、第四級：核心/非常嚴重）"},{"id":"p4-q10","source":"part4 資安法模擬試題","chapter":"D. 事件分級","type":"single","year":"113","question":"資通安全管理法將事件分為四級，下列何項屬於三級？","options":["非核心業務資訊遭嚴重洩漏，或未涉及 CI 之核心業務資訊遭輕微洩漏","非核心業務資訊遭輕微洩漏","一般公務機密、敏感資訊或涉及 CI 之核心業務資訊遭嚴重洩漏，或國家機密遭洩漏","未涉及 CI 之核心業務資訊遭嚴重洩漏，或一般公務機密、敏感資訊或涉及 CI 之核心業務資訊遭輕微洩漏"],"answer":"D","explanation":"B = 第一級、A = 第二級、C = 第四級（國家機密洩漏 → 最高級別）。\n\n💡 解題提示：陷阱：看到「國家機密遭洩漏」直接排除，那是第四級！"},{"id":"p4-q11","source":"part4 資安法模擬試題","chapter":"D. 事件分級","type":"single","year":"114","question":"A 公司（金融機構，A 級）的主機遭勒索軟體加密，影響核心業務且無法於可容忍中斷時間內回復。下列何者錯誤？","options":["一小時內通報金管會","資通安全事件等級判斷為二級","對該主機進行隔離","建議資安長啟動業務持續計畫"],"answer":"B","explanation":"影響核心業務 + 無法於可容忍時間內回復 → 應為 3 或 4 級，不是 2 級。"},{"id":"p4-q12","source":"part4 資安法模擬試題","chapter":"E. 通報 / 審核 / 復原時限","type":"single","year":"114","question":"受管制機關進行資通安全事件應變及通報，下列何者有誤？","options":["知悉事件後，應於一小時內通報","第一級或第二級事件，主管機關於接獲後八小時內完成等級審核","第三級或第四級事件，主管機關於接獲後二小時內完成等級審核","第三級或第四級事件，應於知悉後七十二小時內完成損害控制或復原"],"answer":"D","explanation":"3、4 級應於 36 小時內完成，不是 72 小時。（1/2級：通報1hr、審核8hr、復原72hr｜3/4級：通報1hr、審核2hr、復原36hr）\n\n💡 解題提示：事情越嚴重，時間越短。"},{"id":"p4-q13","source":"part4 資安法模擬試題","chapter":"E. 通報 / 審核 / 復原時限","type":"single","year":"112","question":"某特定非公務機關核心資通系統遭嚴重竄改，須於 36 小時內完成損害控制或復原。中央目的事業主管機關，應於接獲通報後幾小時內完成等級審核？","options":["2","4","6","8"],"answer":"A","explanation":"36hr 復原 + 核心嚴重竄改 → 暗示 3 或 4 級 → 審核 2 小時。"},{"id":"p4-q14","source":"part4 資安法模擬試題","chapter":"E. 通報 / 審核 / 復原時限","type":"single","year":"113","question":"主管機關依規定時間完成資通安全事件等級審核，下列何項正確？","options":["第三/四級事件，於接獲後四小時內","第三/四級事件，於接獲後六小時內","第一/二級事件，於接獲後八小時內","第一/二級事件，於接獲後二小時內"],"answer":"C","explanation":"D 是經典陷阱（把 1、2 級跟 2 小時配在一起，其實 2 小時是 3、4 級的）。"},{"id":"p4-q15","source":"part4 資安法模擬試題","chapter":"E. 通報 / 審核 / 復原時限","type":"single","year":"114","question":"身為 CI 提供者（區域醫療中心）的資安長，發現勒索軟體活動的當下，第一小時內最優先的法定應辦事項為何？","options":["立即支付勒索贖金以最快速度回復系統","全面斷開醫院對外網路，阻止威脅擴散","依據事件分級，完成初步損害評估與判斷，並於一小時內通報主管機關","召集所有資訊人員，優先搶救被加密的電子病歷資料庫"],"answer":"C","explanation":"知悉事件後 1 小時內通報是法定義務。斷網、搶救是技術處置，不是法定優先事項。"},{"id":"p4-q16","source":"part4 資安法模擬試題","chapter":"E. 通報 / 審核 / 復原時限","type":"single","year":"110","question":"關於「資通安全事件通報及應變辦法」，下列何者「不」正確？","options":["資安事件共分四等級","第四級為最重大，第一級為最輕微","該辦法規定只有公務機關遇資安事件時需要通報","若為第一級資安事件，公務機關應於知悉後 72 小時內完成損害控制或復原"],"answer":"C","explanation":"公務機關和特定非公務機關都需要通報，不是只有公務機關。"},{"id":"p4-q17","source":"part4 資安法模擬試題","chapter":"E. 通報 / 審核 / 復原時限","type":"single","year":"111","question":"當某 CI 提供者之核心業務資訊遭受嚴重洩漏，關於通報的敘述，下列何者錯誤？","options":["知悉資通安全事件後應於一小時內進行通報","通報內容應包含為因應該事件所採取之措施","應於知悉該事件後三十六小時內完成損害控制或復原作業","完成損害控制或復原作業後應於二個月內送交調查處理及改善報告"],"answer":"D","explanation":"改善報告是 1 個月內，不是 2 個月。A、B、C 都正確。"},{"id":"p4-q18","source":"part4 資安法模擬試題","chapter":"F. 委外管理（施行細則第 7 條）","type":"single","year":"114","question":"甲金融機構對於受託者之選任作業，下列何者最「不」適切？","options":["確認受託者配置充足且經適當資格訓練之人員","確認受託者擁有 ISO 9001 專業證照","確認受託者具有類似業務經驗之資通安全專業人員","確認受託者具備完善之資通安全管理措施"],"answer":"B","explanation":"ISO 9001 是品質管理，不是資安。法規要求的是「資通安全專業證照」。"},{"id":"p4-q19","source":"part4 資安法模擬試題","chapter":"F. 委外管理（施行細則第 7 條）","type":"single","year":"114","question":"關於複委託應注意之事項，下列何者最「不」適切？","options":["複委託之範圍","複委託之對象","複委託之金額","複委託之受託者應具備之資通安全維護措施"],"answer":"C","explanation":"複委託注意：是否允許、範圍、對象、受託者資安維護措施。沒有「金額」。"},{"id":"p4-q20","source":"part4 資安法模擬試題","chapter":"F. 委外管理（施行細則第 7 條）","type":"single","year":"112、114","question":"【背景：委託金額 880 萬，含核心系統。B 公司部份程式碼取自外部第三方。】（原檔缺題幹，僅有背景與選項）","options":["委託金額未達 1,000 萬元，故無需辦理安全性檢測","本案應由 B 公司負責提供安全性檢測證明","甲金融機構自行或另行委託第三方進行安全性檢測","應標示非自行開發之內容，但無須提供其來源及授權證明"],"answer":"C","explanation":"A 錯：有「核心系統」，條件是「或」，金額未達也須檢測。B 錯：第三方檢測是委託機關的責任。D 錯：須標示內容「與其來源及提供授權證明」。\n\n💡 解題提示：112 年也考過同概念：「甲客戶委託 A 公司對自己的系統做安全性檢測」= 不適當。"},{"id":"p4-q21","source":"part4 資安法模擬試題","chapter":"F. 委外管理（施行細則第 7 條）","type":"single","year":"111","question":"關於委外辦理資通系統時「適任性查核」，下列何者錯誤？","options":["查核有無曾犯洩密罪，或於動員戡亂時期終止前，犯內亂罪、外患罪，經判刑確定","查核有無曾犯洩密罪，或於動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定","查核有無曾受到外國政府之利誘、脅迫，從事不利國家安全情事","查核有無曾受到大陸地區、香港或澳門政府之利誘、脅迫，從事不利國家安全情事"],"answer":"A","explanation":"法規寫的是「動員戡亂時期終止後」，不是「前」。\n\n💡 解題提示：適任性查核只針對「涉及國家機密」的委外業務（施行細則第 7 條第 3 款），不是所有委外都要查核。"},{"id":"p4-q22","source":"part4 資安法模擬試題","chapter":"F. 委外管理（施行細則第 7 條）","type":"multiple","year":"114","question":"B 公司系統開發工程師私自連外網，導致程式碼外洩之重大資通安全事件。關於處置下列哪些最適切？","options":["辦理對 B 公司網路維護工程師之適任性查核","B 公司通報 A 公司並通知甲金融機構資通安全事件","B 公司採行補救措施","甲金融機構決議解除複委託業務，確認受託者返還、移交、刪除或銷毀資料"],"answer":"BCD","explanation":"A 錯：適任性查核是針對「涉及國家機密」，本案是金融機構（資通安全管理法施行細則第7條第1項第六三款，受託業務涉及國家機密者，執行受託業務之相關人員應接受適任性查核）。 B 對：事件通報（資通安全管理法施行細則第7條第1項第五 款，知悉資通安全事件時，應立即通知委託機關）。 C 對：補救措施。（資通安全管理法施行細則第7條第1項第五 款，知悉資通安全事件時，應立即通知委託機關及採行補救措施） D 對：契約終止時資料處置（資通安全管理法施行細則第7條第1項第六 款，委託關係終止或解除時，應確認受託者返還、移交、刪除或銷毀履行契約而持有之資料）。"},{"id":"p4-q23","source":"part4 資安法模擬試題","chapter":"G. 子法對應與維護計畫","type":"single","year":"113、114","question":"下列哪一項子法有定義資通安全演練作業項目？","options":["資通安全責任等級分級辦法","資通安全管理法施行細則","資通安全情資分享辦法","資通安全事件通報及應變辦法 (115改為<<資通安全事件通報應變及演練辦法>>)"],"answer":"D","explanation":"通報應變及演練辦法第 16 條列出五種演練類型：社交工程演練、資通安全事件通報及應變演練、網路攻防演練、情境演練、其他必要之演練。\n\n💡 解題提示：113 年考 1 題、114 年連考 3 題，答案全部都是 (D)。這是送分題，不要想太多。容易搞混的是：分級辦法附表規定的演練只有「營運持續計畫演練」，但問「有哪些演練種類/項目」→ 永遠選通報應變及演練辦法。"},{"id":"p4-q24","source":"part4 資安法模擬試題","chapter":"G. 子法對應與維護計畫","type":"single","year":"108、111（考兩次，換選項）","question":"依據《資通安全管理法施行細則》，下列何者「不」是資通安全維護計畫應包括的事項？","options":["核心業務及其重要性","資通安全稽核組織","資通安全政策及目標","專責人力及經費之配置 (115.01.05年改為專職人力及經費之配置)"],"answer":"B","explanation":"計畫要求「資通安全推動組織」，不是「稽核組織」。\n\n💡 解題提示：108 年也考過同概念，當時錯誤選項是「實施安控的作業程序書」。不管怎麼換，記住施行細則第 6 條列的 13 項就不怕。"},{"id":"p4-q25","source":"part4 資安法模擬試題","chapter":"H. 其他考點","type":"single","year":"110","question":"關於防護基準中，要求密碼「不」得明文存放，是規範在下列何種控制構面？","options":["系統與通訊保護","系統與服務獲得","存取控制","識別與鑑別"],"answer":"D","explanation":"密碼 = 鑑別資訊 → 歸在「識別與鑑別」構面之身分驗證管理。對應：資通安全責任等級分級辦法附表十（防護基準）。"},{"id":"p4-q26","source":"part4 資安法模擬試題","chapter":"H. 其他考點","type":"multiple","year":"113","question":"依據分級辦法與通報應變作業程序，資安事件跡證保存之規劃下列哪些正確？","options":["日誌留存依機關等級而異，等級「普」至少六個月而等級「高」為兩年","日誌保存範圍涵蓋各項資通系統，與資通及防護設備日誌紀錄","日誌宜保存項目為作業系統日誌、網站日誌、應用程式日誌與登入日誌","日誌內容宜含事件類型、發生時間與位置，及事件相關之使用者身分識別等資訊"],"answer":"BCD","explanation":"A 的等級劃分描述有誤。依資通安全責任等級分級辦法附表十（防護基準），事件日誌與可歸責性之記錄事件，等級「普級」之資通系統，訂定日誌之記錄時間週期及留存政策，並保留日誌至少六個月。"},{"id":"p4-q27","source":"part4 資安法模擬試題","chapter":"B. 適用對象與法規判斷","type":"single","year":"113","question":"英國電子商務平台遭駭客入侵導致個資外洩，下列哪些處理程序正確？","options":["依資通安全管理法 2 小時內通報主管機關","依 GDPR 1 週內通報個資外洩","至公開資訊觀測站發布重大訊息","發布程序應遵循公司內部程序"],"answer":"D","explanation":"A 錯：英國公司不適用台灣資安法，且通報時限是 1 小時不是 2 小時（雙重陷阱）。B 錯：GDPR 規定是 72 小時內通報，不是 1 週。C錯：公開資訊觀測站發布重大訊息 ( 錯 )，限公開發行公司，上巿公司、上櫃公司和興櫃公司。\n\n💡 解題提示：這題陷阱很多層。第一層：外國公司根本不適用台灣資安法。第二層：就算適用，時限也不是 2 小時而是 1 小時。第三層：GDPR 的 72 小時也被偷改成 1 週。一題考三個法規的時限辨認。公開資訊觀測站發布重大訊息 ( 錯 )，限公開發行公司，上巿公司、上櫃公司和興櫃公司。"},{"id":"p4-q28","source":"part4 資安法模擬試題","chapter":"B. 適用對象與法規判斷","type":"single","year":"112","question":"發現公司並未依照法規（資安法與上市上櫃資通安全管控指引）定期進行相關作為，下列何者正確？","options":["公司可以不需配置資安長，只需配置適當資安人力","公司遭受重大資安事件，不需揭露相關資安事件重大訊息","強制公司加入台灣電腦網路危機處理暨協調中心","資安納入內部控制，以及資安納入公司治理評鑑"],"answer":"D","explanation":"上市櫃公司須將資安納入內部控制及公司治理評鑑。A 錯：一定資本額以上須配置資安長。B 錯：重大資安事件須揭露重大訊息。C 錯：沒有「強制加入 TWCERT」的規定。\n\n💡 解題提示：這是 I22（防護實務）唯一考資安法的題目，角度跟 I11/I21 不同：不考法條背誦，考的是上市櫃公司實務。"},{"id":"p4-q29","source":"part4 資安法模擬試題","chapter":"H. 其他考點","type":"multiple","year":"113（複選）","question":"A 級公務機關，依「各機關資通安全事件通報及應變處理作業程序」，下列保留期限何者正確？","options":["稽核軌跡：至少 1 年","資通系統日誌：至少 6 個月","系統開發人員修改程式碼紀錄：至少 3 年","網路防護設備/入侵偵測設備日誌：至少 6 個月"],"answer":"BCD","explanation":"A 錯：稽核軌跡保留期限描述有誤。B 對：系統日誌至少 6 個月。C 對：程式碼修改紀錄至少 3 年（這個數字很冷門）。D 對：防護/偵測設備日誌至少 6 個月。\n\n💡 解題提示：跟 Q26 比較：Q26 問「保存哪些類型」，Q29 問「保存多久」。配合一起看就是完整的日誌管理考點。"}];
const byId={};BANK.forEach(q=>byId[q.id]=q);
const SOURCES=[...new Set(BANK.map(q=>q.source))];
const LS="quizApp.v1";
const DEF=()=>({v:1,rec:{},fav:{},pos:{},f:{src:"",ch:""},fs:17,un:false});
function load(){try{const x=JSON.parse(localStorage.getItem(LS));if(x&&x.rec)return Object.assign(DEF(),x)}catch(e){}return DEF()}
let S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("無法儲存（瀏覽器可能禁用了儲存空間）")}}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let sess=null;
document.documentElement.style.setProperty('--fs',S.fs+'px');

function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function inF(q){return(!S.f.src||q.source===S.f.src)&&(!S.f.ch||q.chapter===S.f.ch)}
function pct(a,b){return b?Math.round(a*100/b)+'%':'—'}
function posKey(){return S.f.src+'|'+S.f.ch+'|'+(S.un?1:0)}

/* ---------- 首頁 ---------- */
function home(){
  sess=null;
  let ans=0,r=0,w=0,wrong=0;
  BANK.forEach(q=>{const c=S.rec[q.id];if(c){ans++;r+=c.r;w+=c.w;if(c.last===false)wrong++}});
  const favN=Object.keys(S.fav).filter(id=>byId[id]).length;
  const srcRows=SOURCES.map(s=>{
    const qs=BANK.filter(q=>q.source===s);let a=0,rr=0,ww=0;
    qs.forEach(q=>{const c=S.rec[q.id];if(c){a++;rr+=c.r;ww+=c.w}});
    return `<div class="pr"><span>${esc(s)}</span><span>${a}/${qs.length}・正確率 ${pct(rr,rr+ww)}</span></div><div class="bar"><i style="width:${qs.length?a*100/qs.length:0}%"></i></div>`}).join('');
  const srcOpts=`<option value="">全部題庫（${BANK.length} 題）</option>`+SOURCES.map(s=>`<option value="${esc(s)}" ${S.f.src===s?'selected':''}>${esc(s)}（${BANK.filter(q=>q.source===s).length} 題）</option>`).join('');
  const chs=[...new Set(BANK.filter(q=>!S.f.src||q.source===S.f.src).map(q=>q.chapter))];
  const chOpts=`<option value="">全部章節／分類</option>`+chs.map(c=>`<option value="${esc(c)}" ${S.f.ch===c?'selected':''}>${esc(c)}</option>`).join('');
  const pool=BANK.filter(inF);
  const nW=pool.filter(q=>S.rec[q.id]&&S.rec[q.id].last===false).length;
  const nF=pool.filter(q=>S.fav[q.id]).length;
  const p=S.pos[posKey()]||0;
  const seqN=S.un?pool.filter(q=>!S.rec[q.id]).length:pool.length;
  const resume=!S.un&&p>0&&p<seqN;
  app.innerHTML=`
  <h1>📘 資安刷題</h1>
  <div class="card"><div class="grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><b>${ans}/${BANK.length}</b><span>已作答</span></div>
    <div class="stat"><b>${pct(r,r+w)}</b><span>正確率</span></div>
    <div class="stat"><b>${wrong}</b><span>錯題</span></div>
    <div class="stat"><b>${favN}</b><span>收藏</span></div></div>
    <div style="margin-top:6px">${srcRows}</div></div>
  <div class="card"><h2>選擇範圍（依檔案／章節）</h2>
    <select onchange="setSrc(this.value)">${srcOpts}</select>
    <select onchange="setCh(this.value)">${chOpts}</select>
    <label class="chk"><input type="checkbox" ${S.un?'checked':''} onchange="setUn(this.checked)">只刷未作答的題目（順序／隨機）</label>
    <div class="muted">此範圍共 ${pool.length} 題</div></div>
  <button class="btn pri full" onclick="startQuiz('seq')">▶ 順序刷題${resume?`（接續第 ${p+1} 題）`:''}</button>
  ${resume?`<button class="btn full" onclick="startQuiz('seq',true)">↺ 從第 1 題重新開始</button>`:''}
  <button class="btn full" onclick="startQuiz('rand')">🔀 隨機刷題</button>
  <div class="row"><button class="btn" style="flex:1" onclick="startQuiz('wrong')">❌ 只刷錯題（${nW}）</button>
  <button class="btn" style="flex:1" onclick="startQuiz('fav')">⭐ 只刷收藏（${nF}）</button></div>
  <div class="row" style="margin-top:10px"><button class="btn" style="flex:1" onclick="showList('wrong')">📕 錯題本</button>
  <button class="btn" style="flex:1" onclick="showList('fav')">📚 收藏題</button>
  <button class="btn" style="flex:1" onclick="settings()">⚙️ 設定</button></div>`;
  window.scrollTo(0,0);
}
function setSrc(v){S.f.src=v;S.f.ch="";save();home()}
function setCh(v){S.f.ch=v;save();home()}
function setUn(v){S.un=v;save();home()}

/* ---------- 刷題 ---------- */
function startQuiz(mode,fromStart){
  let list=BANK.filter(inF);
  if(mode==='wrong')list=list.filter(q=>S.rec[q.id]&&S.rec[q.id].last===false);
  else if(mode==='fav')list=list.filter(q=>S.fav[q.id]);
  else if(S.un)list=list.filter(q=>!S.rec[q.id]);
  if(!list.length){toast('這個條件下沒有題目');return}
  if(mode==='rand')list=shuffle(list.slice());
  const key=posKey();let idx=0;
  if(mode==='seq'&&!fromStart&&!S.un){const p=S.pos[key]||0;if(p<list.length)idx=p}
  if(mode==='seq'&&fromStart){S.pos[key]=0;save()}
  sess={list,idx,mode,key,picked:{},done:{},right:0,count:0};
  renderQ();
}
function renderQ(){
  const q=sess.list[sess.idx],d=sess.done[q.id],pk=sess.picked[q.id]||[];
  const ans=q.answer.split(''),multi=ans.length>1,n=sess.list.length;
  const opts=q.options.map((t,i)=>{const L='ABCD'[i];let c='opt';
    if(d){if(ans.includes(L))c+=' ok';else if(pk.includes(L))c+=' bad'}
    else if(pk.includes(L))c+=' sel';
    return `<button class="${c}" onclick="pick('${L}')"><b>${L}</b><span>${esc(t)}</span></button>`}).join('');
  let fb='';
  if(d){
    fb=`<div class="fb ${d.ok?'ok':'bad'}" id="fb"><div class="res">${d.ok?'✅ 答對了':'❌ 答錯了'}</div><div>正確答案：${ans.join('、')}</div>${q.explanation?`<div class="exp">${esc(q.explanation)}</div>`:''}</div>`;
  }
  const submitBtn=(multi&&!d)?`<button class="btn pri full" ${pk.length?'':'disabled'} onclick="submit()">送出答案</button>`:'';
  const modeName={seq:'順序',rand:'隨機',wrong:'錯題',fav:'收藏'}[sess.mode];
  app.innerHTML=`
  <div class="top"><button class="btn sm" onclick="home()">← 返回</button>
    <div class="grow">${sess.idx+1} / ${n}<div class="muted">${modeName}模式・本次 ${sess.right}/${sess.count}</div></div>
    <button class="star" onclick="toggleFav()">${S.fav[q.id]?'⭐':'☆'}</button></div>
  <div class="bar" style="margin-bottom:10px"><i style="width:${(sess.idx+1)*100/n}%"></i></div>
  <div class="card">
    <div><span class="tag">${esc(q.source)}</span><span class="tag">${esc(q.chapter)}</span>${q.year?`<span class="tag">曾考 ${esc(q.year)}</span>`:''}<span class="tag">${multi?'複選（選出所有正確答案）':'單選'}</span></div>
    <div class="q">${esc(q.question)}</div>
    <div class="${d?'locked':''}">${opts}</div>${submitBtn}${fb}</div>
  <div class="nav"><button class="btn" ${sess.idx===0?'disabled':''} onclick="go(-1)">← 上一題</button>
  <button class="btn pri" onclick="go(1)">${sess.idx===n-1?'完成':'下一題 →'}</button></div>`;
}
function pick(L){
  const q=sess.list[sess.idx];if(sess.done[q.id])return;
  let pk=sess.picked[q.id]||[];
  if(q.answer.length>1){pk=pk.includes(L)?pk.filter(x=>x!==L):pk.concat(L);sess.picked[q.id]=pk;keepScroll(renderQ)}
  else{sess.picked[q.id]=[L];submit()}
}
function keepScroll(f){const y=window.scrollY;f();window.scrollTo(0,y)}
function submit(){
  const q=sess.list[sess.idx],pk=(sess.picked[q.id]||[]).slice().sort().join('');
  if(!pk||sess.done[q.id])return;
  const ok=pk===q.answer.split('').sort().join('');
  sess.done[q.id]={ok};sess.count++;if(ok)sess.right++;
  const c=S.rec[q.id]||(S.rec[q.id]={r:0,w:0,last:null});
  if(ok)c.r++;else c.w++;c.last=ok;
  save();renderQ();
  const fb=document.getElementById('fb');if(fb)fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function toggleFav(){
  const q=sess.list[sess.idx];
  if(S.fav[q.id])delete S.fav[q.id];else S.fav[q.id]=1;
  save();keepScroll(renderQ);
}
function go(d){
  const n=sess.list.length;
  if(sess.idx+d>=n){finish();return}
  if(sess.idx+d<0)return;
  sess.idx+=d;
  if(sess.mode==='seq'&&!S.un){S.pos[sess.key]=sess.idx;save()}
  renderQ();window.scrollTo(0,0);
}
function finish(){
  if(sess.mode==='seq'&&!S.un){S.pos[sess.key]=0;save()}
  app.innerHTML=`<h1>🎉 本輪完成</h1><div class="card"><div class="grid">
   <div class="stat"><b>${sess.count}</b><span>本次作答</span></div>
   <div class="stat"><b>${pct(sess.right,sess.count)}</b><span>本次正確率</span></div></div>
   <p class="muted">共 ${sess.list.length} 題，已作答 ${sess.count} 題。</p></div>
   <button class="btn pri full" onclick="home()">回首頁</button>
   <button class="btn full" onclick="showList('wrong')">看錯題本</button>`;
  window.scrollTo(0,0);
}

/* ---------- 錯題本／收藏 ---------- */
function showList(kind){
  sess=null;
  const items=BANK.filter(q=>kind==='wrong'?(S.rec[q.id]&&S.rec[q.id].last===false):S.fav[q.id]);
  const title=kind==='wrong'?'📕 錯題本':'📚 收藏題';
  const rows=items.map(q=>`<div class="item"><span class="tag">${esc(q.source)}</span><span class="tag">${esc(q.chapter)}</span>
   <div>${esc(q.question)}</div><small>正確答案：${q.answer.split('').map(L=>L+'. '+esc(q.options['ABCD'.indexOf(L)])).join('；')}</small>
   <div style="margin-top:6px"><button class="btn sm" onclick="rmItem('${kind}','${q.id}')">${kind==='wrong'?'移出錯題本':'取消收藏'}</button></div></div>`).join('');
  app.innerHTML=`<div class="top"><button class="btn sm" onclick="home()">← 返回</button><div class="grow">${title}（${items.length}）</div></div>
   ${items.length?`<button class="btn pri full" onclick="S.f={src:'',ch:''};save();startQuiz('${kind}')">開始練習（全部${kind==='wrong'?'錯題':'收藏'}）</button>
   <div class="card">${rows}</div>`:'<div class="card muted">目前沒有題目。</div>'}`;
  window.scrollTo(0,0);
}
function rmItem(kind,id){
  if(kind==='wrong'){if(S.rec[id])S.rec[id].last=null}else delete S.fav[id];
  save();showList(kind);
}

/* ---------- 設定／備份 ---------- */
function settings(){
  app.innerHTML=`<div class="top"><button class="btn sm" onclick="home()">← 返回</button><div class="grow">⚙️ 設定與備份</div></div>
  <div class="card"><h2>字體大小</h2><div class="row">
   <button class="btn sm" onclick="setFs(-1)">A－ 縮小</button><button class="btn sm" onclick="setFs(1)">A＋ 放大</button>
   <span class="muted" style="align-self:center">目前 ${S.fs}px</span></div></div>
  <div class="card"><h2>匯出進度（備份）</h2>
   <p class="muted">進度只存在這支手機的瀏覽器裡。清除瀏覽器資料會遺失，請定期匯出。</p>
   <button class="btn pri full" onclick="exportFile()">下載備份檔（JSON）</button>
   <button class="btn full" onclick="showText()">改用複製文字備份</button>
   <textarea id="ta" placeholder="複製文字備份／貼上備份文字於此" style="display:none"></textarea>
   <button class="btn full" id="cpb" style="display:none" onclick="copyTxt()">複製文字</button></div>
  <div class="card"><h2>匯入進度</h2>
   <p class="muted">匯入會覆蓋目前這支手機上的進度。</p>
   <input type="file" accept=".json,application/json" onchange="importFile(this)" style="margin-bottom:10px;width:100%">
   <button class="btn full" onclick="importText()">從上方文字框匯入</button></div>
  <div class="card"><h2>重置</h2><button class="btn danger full" onclick="resetAll()">清除所有作答紀錄、錯題、收藏</button></div>
  <div class="muted">題庫：${BANK.length} 題（${SOURCES.length} 份題庫）</div>`;
  window.scrollTo(0,0);
}
function setFs(d){S.fs=Math.max(14,Math.min(26,S.fs+d*2));document.documentElement.style.setProperty('--fs',S.fs+'px');save();settings()}
function stamp(){const o=Object.assign({},S,{exportedAt:new Date().toISOString(),app:"quiz-v1"});return JSON.stringify(o)}
function exportFile(){
  try{const b=new Blob([stamp()],{type:'application/json'});const a=document.createElement('a');
  const d=new Date();a.href=URL.createObjectURL(b);a.download='刷題進度_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('已產生備份檔')}
  catch(e){toast('下載失敗，請改用「複製文字備份」')}
}
function showText(){const t=document.getElementById('ta');t.style.display='block';t.value=stamp();document.getElementById('cpb').style.display='block'}
function copyTxt(){const t=document.getElementById('ta');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('已複製'),()=>{document.execCommand('copy');toast('已複製')})}catch(e){document.execCommand('copy');toast('已複製')}}
function applyImport(txt){
  try{const o=JSON.parse(txt);if(!o||typeof o.rec!=='object')throw 0;
    if(!confirm('匯入會覆蓋目前的進度，確定嗎？'))return;
    S=Object.assign(DEF(),o);delete S.exportedAt;delete S.app;save();
    document.documentElement.style.setProperty('--fs',S.fs+'px');toast('匯入成功');home()}
  catch(e){toast('匯入失敗：檔案格式不正確')}
}
function importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyImport(r.result);r.readAsText(f)}
function importText(){const t=document.getElementById('ta');t.style.display='block';if(!t.value.trim()){toast('請先在文字框貼上備份文字');return}applyImport(t.value)}
function resetAll(){if(confirm('確定要清除所有作答紀錄、錯題與收藏嗎？此動作無法復原。')){const fs=S.fs;S=DEF();S.fs=fs;save();toast('已重置');home()}}

/* ---------- 加入主畫面用的圖示與 manifest ---------- */
(function(){try{
  const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');
  x.fillStyle='#2563eb';x.fillRect(0,0,192,192);x.fillStyle='#fff';x.font='bold 84px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('資安',96,92);
  const url=c.toDataURL('image/png');
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=url;document.head.appendChild(l);
  const m={name:'資安刷題',short_name:'資安刷題',display:'standalone',start_url:location.href,background_color:'#2563eb',theme_color:'#2563eb',icons:[{src:url,sizes:'192x192',type:'image/png'}]};
  const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k);
}catch(e){}})();

home();
</script>
</body>

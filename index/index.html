<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資安刷題">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>資安刷題</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--sub:#667085;--line:#dde2ea;--pri:#2563eb;--ok:#16a34a;--okbg:#e7f7ec;--bad:#dc2626;--badbg:#fdeaea;--selbg:#e8efff;--fs:17px}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a212d;--tx:#e8ecf3;--sub:#9aa5b8;--line:#2c3646;--pri:#5b8cff;--ok:#4ade80;--okbg:#12301d;--bad:#f87171;--badbg:#3a1717;--selbg:#1d2a4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:var(--fs);line-height:1.6}
#app{max-width:720px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom));padding-top:calc(12px + env(safe-area-inset-top))}
h1{font-size:1.35em;margin:6px 0 12px}
h2{font-size:1.05em;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;padding:8px 4px}
.stat b{display:block;font-size:1.5em;color:var(--pri)}
.stat span{font-size:.8em;color:var(--sub)}
button,select,textarea{font:inherit;color:inherit}
.btn{min-height:50px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{min-height:40px;font-size:.85em;padding:6px 10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4}
.btn.full{width:100%;margin-bottom:10px}
select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 10px;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:.72em;background:var(--selbg);color:var(--pri);border-radius:8px;padding:1px 8px;margin:0 6px 6px 0}
.q{font-size:1.08em;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;min-height:52px;cursor:pointer;align-items:flex-start}
.opt b{flex:0 0 1.6em;height:1.6em;border-radius:50%;background:var(--line);text-align:center;line-height:1.6em;font-size:.9em}
.opt span{flex:1;word-break:break-word}
.opt.sel{border-color:var(--pri);background:var(--selbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad b{background:var(--bad);color:#fff}
.locked .opt{pointer-events:none}
.fb{border-radius:12px;padding:12px;margin:4px 0 10px;background:var(--card);border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb .res{font-weight:700}
.fb.ok .res{color:var(--ok)}.fb.bad .res{color:var(--bad)}
.exp{margin-top:8px;white-space:pre-wrap;font-size:.95em;color:var(--tx)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .grow{flex:1;text-align:center;font-weight:600}
.star{font-size:1.5em;background:none;border:0;min-width:44px;min-height:44px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:720px;margin:0 auto}
.nav .btn{flex:1}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.item small{color:var(--sub)}
.muted{color:var(--sub);font-size:.85em}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px;margin-bottom:6px}
label.chk input{width:22px;height:22px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px;font-size:.8em}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9em;z-index:9;max-width:90%}
.pr{display:flex;justify-content:space-between;font-size:.85em;margin:8px 0 3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BANK=[{"id":"p1-u01-q01","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"依據《資通安全管理法》第 3 條第 1 項的定義，以下何者最能完整描述「資通系統」？","options":["指用以儲存及流通資訊之硬體設備。","指用以傳輸或分享資訊之網路軟體。","指用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統。","指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。"],"answer":"C","explanation":""},{"id":"p1-u01-q02","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"下列關於「資產」的敘述，何者符合 ISO/CNS 27002 標準的定義？","options":["資產限於硬體和軟體等實體項目。","資產被定義為對組織有價值的任何事物。","主要資產僅指資訊，不包含營運流程與活動。","支援資產不包含人員和場域等要素。"],"answer":"B","explanation":""},{"id":"p1-u01-q03","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"建立資通安全的危機意識的重要性，以下何者「錯誤」？","options":["資安的危害可能產生超乎一般人的想像，造成重大影響。","資安攻擊無所不在，影響層面廣大。","資安是資安專業人員的專屬責任，與一般員工無關。","資安素養是現代公民需要培養的生活與工作知能。"],"answer":"C","explanation":""},{"id":"p1-u01-q04","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"資通安全的三個核心防護目標（CIA）是指？","options":["便利性、完整性、可用性","機密性、有效性、整合性","成本性、效率性、可用性","機密性、完整性、可用性"],"answer":"D","explanation":""},{"id":"p1-u01-q05","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"為保護資料的「機密性」，下列哪一項為其主要措施？","options":["雜湊函數與數位簽章。","容量規劃與備份。","資料加解密與存取控制。","容錯與負載平衡。"],"answer":"C","explanation":""},{"id":"p1-u01-q06","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"當資通安全事件涉及資料被「未經授權地修改或破壞」時，這主要影響了資通安全的哪一個防護目標？","options":["完整性","機密性","可用性","法律遵循性"],"answer":"A","explanation":""},{"id":"p1-u01-q07","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"以下何者「不是」資通安全防護目標中「可用性」的主要保護措施？","options":["容量規劃","備份","數位簽章","容錯、備援及負載平衡"],"answer":"C","explanation":""},{"id":"p1-u01-q08","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"《資通安全管理法》對「資通服務」的定義為何？","options":["專指政府機關內部使用的資訊系統。","指與資訊之蒐集、控制、傳輸、儲存、流通、刪除、其他處理、使用或分享相關之服務。","僅指雲端運算提供的各種服務。","專指軟體開發與維護活動。"],"answer":"B","explanation":""},{"id":"p1-u01-q09","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"在資通安全風險意識的建立中，物聯網（IoT）的普及帶來了商機，同時也引發了哪些資安危機的思考？","options":["造成個人隱私洩露，但從不影響國家層面的資安風險。","增加被攻擊的風險，可能導致更大的不便。","對於軟體層面不會造成威脅，而只會對硬體設備造成威脅。","促進資訊自由流通，完全沒有資安隱患。"],"answer":"B","explanation":""},{"id":"p1-u01-q10","source":"part1 自我評量測驗v3","chapter":"第1單元：資通安全基本觀念","type":"single","question":"資通安全防護目標中的「法律遵循性」主要指的是什麼？","options":["資安措施的重點為遵守《資通安全管理法》，不包含其他法規。","確保所有資安措施都符合國際標準 ISO 27001。","資訊安全措施必須符合相關的法律規定，如《資通安全管理法》、《個人資料保護法》等。","資訊安全措施主要依循機關內部制定的資安政策與規範，不受外部法律約束。"],"answer":"C","explanation":""},{"id":"p1-u02-q01","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"我國資通安全管理體系的最高指導及協調單位是哪一個？","options":["數位發展部資通安全署","國家資通安全會報","國防部資通電軍指揮部","內政部警政署"],"answer":"B","explanation":""},{"id":"p1-u02-q02","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"依據《資通安全管理法》，以下哪一類機關「不」屬於其適用對象？","options":["關鍵基礎設施提供者","公營事業","軍事機關","政府捐助之財團法人"],"answer":"C","explanation":""},{"id":"p1-u02-q03","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"《資通安全管理法》的立法目的主要為何？","options":["規範個人資料蒐集與利用，避免人格權侵害。","促進新興科技的資安技術發展。","提升國家整體資安防護能力，保障國家安全和社會公共利益。","該法案的立法目的完全集中於處理網路犯罪的偵查與防制。"],"answer":"C","explanation":""},{"id":"p1-u02-q04","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"依據《資通安全管理法施行細則》，公務機關與特定非公務機關在資通安全事件發生「事前」應辦理的共同義務為何？","options":["提出改善報告。","接受資通安全稽核。","提交資通安全事件調查報告。","訂定資通安全維護計畫及通報應變機制。"],"answer":"D","explanation":""},{"id":"p1-u02-q05","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"依據《資通安全管理法》規定，公務機關除了資安長外，還需設置什麼人員？","options":["資安專責人員 (非專職)","資安專職人員","公關經理","法律顧問"],"answer":"B","explanation":""},{"id":"p1-u02-q06","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"《資通安全管理法施行細則》第 7 條對「核心資通系統」的定義中，以下何者「不」是判斷標準？","options":["支持核心業務持續運作必要之系統。","依資通安全責任等級分級辦法判定防護需求等級為高者。","一般行政作業的辦公室軟體之必要功能。","業務涉及全國性民眾服務或跨公務機關共用性資通系統之維運。"],"answer":"C","explanation":""},{"id":"p1-u02-q07","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"依據《資通安全責任等級分級辦法》，各機關應多久提報或核定其資通安全責任等級 1 次？","options":["每年","每 2 年","每 3 年","每 5 年"],"answer":"C","explanation":""},{"id":"p1-u02-q08","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"關於《個人資料保護法》的目的，以下何者敘述「最完整」？","options":["其主要目的為避免人格權受侵害，與個人資料之利用無關。","其主要目的為促進個人資料之合理利用，不涉及人格權的保護。","為規範個人資料之蒐集、處理及利用，以避免人格權受侵害，並促進個人資料之合理利用。","為積極推動國家資通安全政策。"],"answer":"C","explanation":""},{"id":"p1-u02-q09","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"比較《個人資料保護法》與《資通安全管理法》，關於其主管機關的敘述，何者正確？","options":["兩者主管機關皆為數位發展部。","《個人資料保護法》主管機關為個人資料保護委員會（含籌備機制），《資通安全管理法》主管機關為數位發展部。","《個人資料保護法》主管機關為法務部，《資通安全管理法》主管機關為內政部。","兩者皆無特定主管機關。"],"answer":"B","explanation":""},{"id":"p1-u02-q10","source":"part1 自我評量測驗v3","chapter":"第2單元：資通安全相關法規","type":"single","question":"依據《國家機密保護法》，以下哪一個是「絕對機密」的最長保密期限？","options":["10 年","20 年","30 年","永久保密"],"answer":"C","explanation":""},{"id":"p1-u03-q01","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"在資通安全風險管理中，「風險」的定義是什麼？","options":["威脅本身的存在。","資產的脆弱性。","威脅利用其相對應脆弱性，造成組織或政府機關資訊資產受到衝擊的可能性。","資安攻擊造成的直接財務損失。"],"answer":"C","explanation":""},{"id":"p1-u03-q02","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"資通安全風險管理的最終目標是什麼？","options":["達到絕對的安全性，不計成本。","在最低的防護成本投入下獲得最佳化的安全性。","將所有資安風險完全消除。","以符合法規最低標準為目標，不考慮其他資安提升措施。"],"answer":"B","explanation":""},{"id":"p1-u03-q03","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"在風險管理的全景建立中，進行風險評鑑與實作資安各項防護控制措施前，應識別哪些方面的安全需求？","options":["識別資安需求時，主要關注組織內部環境，不包括外部因素。","識別資安需求時，主要關注外部環境，不包括內部因素。","應識別機關內、外各方面的安全需求。","識別資安需求時，重心放在技術能力與經費預算，可忽略其他重要方面。"],"answer":"C","explanation":""},{"id":"p1-u03-q04","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"關於「高階風險評鑑」方法的優點，以下何者敘述不正確？","options":["一開始採用較簡便作法，容易獲得參與人員接受。","評鑑結果較為精確，能識別所有營運過程或系統的潛在風險。","把握時效，讓最關鍵且需受保護的資通系統優先被提出與實作。","可將資源與預算運用於最有利之處。"],"answer":"B","explanation":""},{"id":"p1-u03-q05","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"在資通系統安全等級設定中，若某資通系統資料外洩將「危及國家安全」，或涉及「特殊屬性之個人資料」外洩導致相關個人身心受到危害，則其「機密性」應被評定為哪個等級？","options":["高級","中級","普級","無法評估"],"answer":"A","explanation":""},{"id":"p1-u03-q06","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"下列哪種風險評鑑作法是對資產進行深度識別與鑑別，並詳細列出可能面臨威脅與可能存在的弱點？","options":["高階風險評鑑作法","普級風險評鑑作法","詳細風險評鑑作法","簡易風險評鑑作法"],"answer":"C","explanation":""},{"id":"p1-u03-q07","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"在建立風險評鑑組織時，建議應如何組建，以避免產出結果過於主觀？","options":["由資訊人員或資安人員全權執行，不需徵詢其他部門的意見。","由單一成員執行所有資通系統風險評鑑工作。","建議成立「跨部門」風險評鑑組織，並宜包含熟悉業務的承辦人員。","由高層主管主導評鑑，不需納入跨部門的多元觀點。"],"answer":"C","explanation":""},{"id":"p1-u03-q08","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"當機關面對風險時，若決定不採取額外行動，而是接受風險可能帶來的後果，這種風險處理方式稱為什麼？","options":["風險修改","風險避免","風險分擔","風險留存"],"answer":"D","explanation":""},{"id":"p1-u03-q09","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"針對社交工程攻擊，除了進行演練作業外，本課程指出最經濟有效的控制措施是什麼？","options":["透過部署高階防火牆即可有效防禦社交工程攻擊。","強化認知訓練與宣導。","移除所有對外連線。","購買資安保險。"],"answer":"B","explanation":""},{"id":"p1-u03-q10","source":"part1 自我評量測驗v3","chapter":"第3單元：資通安全風險管理","type":"single","question":"將因機房設備損壞造成的損失風險轉移給保險公司，這種風險處理方式屬於哪一種？","options":["風險避免","風險修改","風險分擔","風險留存"],"answer":"C","explanation":""},{"id":"p1-u04-q01","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"依據資通安全責任等級機關應辦事項規定，A 級機關初次受核定或等級變更後，應在多久時間內完成資通系統分級並完成附表十的控制措施？","options":["1 年內","2 年內","3 年內","無明確時程要求"],"answer":"A","explanation":""},{"id":"p1-u04-q02","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"依據附表九資通系統防護需求分級原則，當資通系統發生資安事件導致「未經授權之資訊揭露」，對機關營運、資產或信譽產生「嚴重」影響時，其「機密性」防護需求應評定為哪個等級？","options":["普","中","高","極高"],"answer":"B","explanation":""},{"id":"p1-u04-q03","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"依據資通安全管理面應辦事項，公務機關 A 級及 B 級的「核心資通系統」應在初次受核定或等級變更後多久完成 ISO 27001 或 CNS 27001等資訊安全管理系統的導入？","options":["1 年內","2 年內","3 年內","無要求"],"answer":"B","explanation":""},{"id":"p1-u04-q04","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"依據《資通安全責任等級分級辦法》規定，A 級公務機關應在機關初次受核定或等級變更後多久時間內，配置幾位資通安全專職人員？","options":["1 年內，2 人","1 年內，4 人","2 年內，2 人","2 年內，4 人"],"answer":"B","explanation":""},{"id":"p1-u04-q05","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"關於資通安全稽核的類別，以下何者是組織內部的自我檢查，通常稽核範圍為「全機關」？","options":["第一方稽核","第二方稽核","第三方稽核","外部稽核"],"answer":"A","explanation":""},{"id":"p1-u04-q06","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"業務持續運作演練中，「復原時間點目標 (RPO)」主要定義了什麼？","options":["系統從中斷後至恢復服務所需的最大可容忍時間。","完成備份還原測試所需的時間。","業務中斷後，對組織可能造成的最大不利衝擊時間。","系統可容忍資料損失的最大時間要求。"],"answer":"D","explanation":""},{"id":"p1-u04-q07","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"關於資安治理與資安管理的區分，以下何者敘述正確？","options":["資安治理由資安長主導，資安管理由機關首長主導。","資安治理負責具體執行資安措施，資安管理負責提供指導與監視。","資安治理從組織需求出發，提供指導與監視；資安管理負責規劃、建立、執行與監督。","兩者權責範圍完全相同，沒有區分必要。"],"answer":"C","explanation":""},{"id":"p1-u04-q08","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"在資安治理成熟度評估中，Level 3「標準化流程 (Established Process)」的定義為何？","options":["該流程尚未建立或無法達成目標。","該流程之執行結果已達到預先設定目標。","該流程已被標準化，並且已被有效地部署於組織中。","該流程可透過衡量結果了解執行成效，且流程已被量化管理。"],"answer":"C","explanation":""},{"id":"p1-u04-q09","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"依據資安認知與訓練應辦事項，一般使用者及主管（A、B、C、D 級機關）每年至少應接受多少小時的資通安全通識教育訓練？","options":["1 小時","3 小時","6 小時","12 小時"],"answer":"B","explanation":""},{"id":"p1-u04-q10","source":"part1 自我評量測驗v3","chapter":"第4單元：資通安全管理面暨認知與訓練應辦事項","type":"single","question":"在業務持續運作的「管理程序」中，特別強調成功執行業務持續運作的關鍵，除了高階管理人員的認同與支持外，還需要哪些部門的投入？","options":["資訊部門的投入是唯一必要的。","成功運作僅需高階管理層和資安部門的投入，其他部門的角色無關緊要。","必須是核心業務所有相關部門投入，而非僅是資訊部門的責任。","外部顧問的投入足以確保成功，無需內部資源參與。"],"answer":"C","explanation":""},{"id":"p1-u05-q01","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"依據「事件日誌與可歸責性」之安全控制措施，機關應訂定日誌之記錄時間週期及留存政策。請問法定要求作業系統、網站或應用程式之日誌，至少應保留多長時間，以提供足夠的歷史資料供後續追溯分析？","options":["至少保留 1 個月。","至少保留 3 個月。","至少保留 6 個月。","至少保留 1 年。"],"answer":"C","explanation":""},{"id":"p1-u05-q02","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"關於對稱式加解密演算法(如 AES)，下列何者是其主要的特點？","options":["加密與解密使用不同的金鑰。","無法保證資料機密性。","加解密速度比非對稱式慢。","加密與解密使用同一把金鑰。"],"answer":"D","explanation":""},{"id":"p1-u05-q03","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"關於資通系統「日誌紀錄內容」的要求，以下何者是所有等級（普中高）遵循的「基本資訊內容」原則？","options":["日誌應包含事件類型、發生時間、發生位置及相關使用者身分識別等資訊。","日誌記錄應僅限於系統層級的錯誤訊息，以減少儲存空間。","日誌資料只需在系統發生異常時才啟動記錄，平時可關閉。","日誌的輸出格式應能根據不同部門的需求，自訂多種樣式。"],"answer":"A","explanation":""},{"id":"p1-u05-q04","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"關於營運持續計畫之「復原點目標」(RPO)，主要是衡量組織對下列何者的容忍度？","options":["服務中斷的時間長度。","資料損失的時間量。","維修人員到場的速度。","設備更新的經費。"],"answer":"B","explanation":""},{"id":"p1-u05-q05","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"在資料備份方式中，哪一種備份方式在還原時最為複雜，需要先還原最近一次的完整備份，然後依序還原所有自上次完整備份以來的備份？","options":["完整備份。","差異備份。","增量備份。","鏡像備份。"],"answer":"C","explanation":""},{"id":"p1-u05-q06","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"為了顯著提高身分驗證的強度，降低帳號被盜用的風險，資通系統存取應採取的鑑別技術是？","options":["多因子鑑別技術。","變更預設密碼。","唯一識別功能。","帳戶鎖定機制。"],"answer":"A","explanation":""},{"id":"p1-u05-q07","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"安全系統發展生命週期 (SSDLC) 強調於專案各階段及早加入安全思維，以打造具備安全體質的資通系統。以下哪個選項「不是」SSDLC 的實作階段之一？","options":["需求階段。","銷售階段。","開發階段.","部署與維運階段。"],"answer":"B","explanation":""},{"id":"p1-u05-q08","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"關於加密金鑰或憑證的管理，以下何者敘述不正確？","options":["加密金鑰或憑證應定期更換。","避免使用萬年憑證，增加被破解風險。","伺服器端之金鑰保管應訂定管理規範。","加密金鑰與加密資料應存放在同一位置，方便管理。"],"answer":"D","explanation":""},{"id":"p1-u05-q09","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"關於系統漏洞修復的措施，以下何者是正確的？","options":["系統漏洞修復應直接在正式環境進行，以節省時間。","只需注意廠商的安全通告，無需關注 CVE 等網站。","漏洞修復應測試有效性及潛在影響，並定期更新。","由弱點掃描檢出之系統漏洞，無需定期追蹤修復進度。"],"answer":"C","explanation":""},{"id":"p1-u05-q10","source":"part1 自我評量測驗v3","chapter":"第5單元：資通系統防護控制措施","type":"single","question":"在儲存媒體安全丟棄或銷毀前，應採取哪些措施以防止資料洩漏？","options":["刪除資料後，無需進一步處理即可安全丟棄儲存媒體。","對儲存媒體進行實體破壞後，不須確認資料是否已被徹底銷毀。","應先安全的刪除資料或進行實體的破壞。","無需特別處理，直接丟棄即可。"],"answer":"C","explanation":""},{"id":"p1-u06-q01","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"防毒軟體在資通安全防護與偵測措施中扮演重要角色，其主要用途是防範下列哪一類的惡意程式入侵電腦軟體或系統？","options":["僅限於防範傳統型態的電腦病毒。","蠕蟲、間諜軟體、後門程式及木馬程式。","主要用於加密網路通訊，而非防範惡意程式。","僅限於防範勒索軟體，不包含其他惡意程式。"],"answer":"B","explanation":""},{"id":"p1-u06-q02","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"關於防毒軟體的管理重點，以下哪項敘述是不正確？","options":["應定期自動更新病毒碼。","病毒感染的事件與趨勢應定期分析。","應避免未安裝防毒軟體的電腦上線。","「個人電腦與伺服器防毒系統」與「防毒匣道系統」應採用相同廠牌以簡化管理。"],"answer":"D","explanation":""},{"id":"p1-u06-q03","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"網路防火牆的主要功能是什麼？","options":["其唯一功能是監測內部網路的流量，不涉及外部連線。","限制不必要的服務埠號開啟，僅允許必要的服務連線。","網路防火牆的功能僅限於阻擋已知的惡意軟體入侵。","主要用於加密網路通訊。"],"answer":"B","explanation":""},{"id":"p1-u06-q04","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"關於網路防火牆的管理重點，以下哪項是確保其安全有效運作的關鍵？","options":["防火牆存取規則的變更無需管理程序。","防火牆存取紀錄無需即時匯出，定期備份即可。","定期產出異常存取統計分析報表，進行異常處理。","防火牆存取控管規則終身無需盤查。"],"answer":"C","explanation":""},{"id":"p1-u06-q05","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"電子郵件過濾機制的核心管理重點之一，是如何處理其規則的變更？","options":["規則變更由系統自動完成，無需人工介入。","規則變更應建立管理程序，包含變更申請、核准及記錄。","規則變更頻率越快越好，不需考量影響。","規則變更僅由技術人員私下進行。"],"answer":"B","explanation":""},{"id":"p1-u06-q06","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"在選購電子郵件過濾機制時，除了其判斷垃圾郵件的精準度外，建議機關還應考量哪些其他重要因素，以確保機制能全面符合業務需求？","options":["僅需關注是否提供基礎的郵件收發功能。","主要考量系統的硬體規格是否為最高級別。","應評估對於中文信件或多國語言的支援能力。","僅需確認系統的初始購買成本是否最低。"],"answer":"C","explanation":""},{"id":"p1-u06-q07","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"面對 APT（進階持續性威脅）攻擊，除了加強防禦，還應具備哪種能力，以應對攻擊後的影響？","options":["只需要部署單一高階資安設備即可全面應對。","提升系統效能以加速攻擊。","透過備份管理等機制進行快速復原。","減少資安事件日誌紀錄。"],"answer":"C","explanation":""},{"id":"p1-u06-q08","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"為了有效防禦 APT 攻擊，透過哪種機制可提升安全防禦策略及戰略的部署？","options":["完全依賴內部資安團隊的分析，不參考外部資訊。","透過跨機關的資安聯防機制、情資的交換機制。","專注於修補已知漏洞，不需情資共享。","減少對外部威脅情資的關注。"],"answer":"B","explanation":""},{"id":"p1-u06-q09","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"關於「政府組態基準 (GCB)」的目的和部署範圍，以下敘述何者不正確","options":["GCB 目的在於發展一致性安全組態設定。","GCB 可提升政府機關資通訊設備之資安防護。","GCB 部署範圍僅限於伺服器。","GCB 的導入是 A 級與 B 級公務機關必須辦理的事項。"],"answer":"C","explanation":""},{"id":"p1-u06-q10","source":"part1 自我評量測驗v3","chapter":"第6單元：資通安全技術面應辦事項-資通安全防護及偵測","type":"single","question":"在組態變更管理中，當 IT 系統的組態變更時，下列哪一項層面是應特別考量的？","options":["進行組態變更時，考量重點僅在於系統功能是否正常運行。","應考量可用性影響、安全組態影響及存取控制影響。","組態變更評估時，唯一需考慮的因素是變更所產生的成本。","變更後無需更新組態管理資料庫。"],"answer":"B","explanation":""},{"id":"p1-u07-q01","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"依據資通安全責任等級規定，A 級機關的滲透測試與弱點掃描頻率為何？","options":["每年 1 次滲透測試，每年 1 次弱點掃描。","每 2 年 1 次滲透測試，每年 1 次弱點掃描。","每年 1 次滲透測試，每年 2 次弱點掃描。","每 2 年 1 次滲透測試，每 2 年 1 次弱點掃描。"],"answer":"C","explanation":""},{"id":"p1-u07-q02","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"關於弱點掃描與滲透測試的主要差異，以下敘述何者正確？","options":["弱點掃描是一種模擬攻擊，滲透測試是自動化檢測。","弱點掃描用於快速識別已知漏洞，滲透測試用於驗證防護措施有效性並找出可利用弱點。","弱點掃描主要針對內部網路，滲透測試主要針對外部網路。","弱點掃描不需要修補，滲透測試才需要。"],"answer":"B","explanation":""},{"id":"p1-u07-q03","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"在應用程式安全中，安全系統開發生命週期（SSDLC）的「部署與維運」階段應落實哪些重要工作？","options":["擬訂資安需求與測試計畫。","執行風險分析與評估。","定期修補漏洞、升級更新版本及即時監控。","進行源碼掃描安全檢測。"],"answer":"C","explanation":""},{"id":"p1-u07-q04","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"為了確保變更不會成為新的風險來源，應用程式安全中的「變更控制」機制強調所有變更都需符合哪三個關鍵要素？","options":["簡單、快速、有效。","授權、測試、記錄。","自動、手動、半自動。","規劃、執行、評估。"],"answer":"B","explanation":""},{"id":"p1-u07-q05","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"資通安全健診的目的為何？","options":["資通安全健診的主要目的是處理已知的資安事件，不包括預防措施。","資通安全健診服務僅限於提供資通系統的漏洞掃描，不提供其他建議。","整合各資通安全項目的檢視服務作業，提供機關資通安全改善建議，並提升整體防護能力。","其目的只在於評估內部人員的資安意識，不涉及系統層面的檢視。"],"answer":"C","explanation":""},{"id":"p1-u07-q06","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"在資通安全健診的「使用者端電腦惡意活動檢視」項目中，應檢視哪些內容？","options":["檢視內容局限於網路架構圖的安全性，不包含實際系統配置。","檢視惡意活動時，主要檢查伺服器主機的作業系統更新，不包括使用者端。","檢視作業系統及應用程式的安全性更新、是否使用停止支援的軟體、及防毒軟體狀態。","只需要架設封包側錄設備來觀察對外異常連線，其他方法不需使用。"],"answer":"C","explanation":""},{"id":"p1-u07-q07","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"關於網路連線安全，為何應避免使用 HTTP、FTP 和 TELNET 等協議進行敏感資料傳輸？","options":["這些協議採用明文傳輸，通訊內容有可能被監聽，容易造成資訊洩露風險。","這些協議不支援大檔案傳輸。","這些協議傳輸速度較慢。","這些協議容易受到分散式阻斷服務（DDoS）攻擊。"],"answer":"A","explanation":""},{"id":"p1-u07-q08","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"雲端運算具備多項核心特性，以下何者敘述是關於「受量測服務(Measured Service)」的特性？","options":["雲端資源可以被快速且彈性地擴展或縮減。","多個客戶共享同一套基礎設施和應用程式。","供應商會對資源的使用情況進行監控、測量和報告，通常按照實際消耗量計費。","雲端服務可以透過標準的網路機制廣泛被存取。"],"answer":"C","explanation":""},{"id":"p1-u07-q09","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"在雲端安全管理中，ISO/IEC 27017:2015 標準強調了哪些關鍵考量，尤其是關於供應商與客戶的責任界線？","options":["雲端安全管理只關注虛擬機器的強化，不涉及其他層面。","雲端環境下的角色共享與權責，以及雲端服務客戶資產的移除。","需確保虛擬和實體網路安全管理的一致性。","雲端安全管理只針對管理者的操作安全進行考量，不包括客戶端的責任。"],"answer":"B","explanation":""},{"id":"p1-u07-q10","source":"part1 自我評量測驗v3","chapter":"第7單元：資通安全技術面應辦事項-安全性檢測及資通安全健診","type":"single","question":"實體安全的三個核心防禦策略為嚇阻、延遲、偵測與處理。以下何者是屬於「嚇阻」的措施？","options":["感應式讀卡機。","設置多層門禁。","公布違反實體控管要求人員姓名。","紅外線進出感應。"],"answer":"C","explanation":""},{"id":"p1-u08-q01","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"依據《資通安全管理法》第 10 條，機關委外辦理資通系統或服務時，應考量哪些因素來選任適當受託者並監督其維護情形？","options":["唯一的考量因素是服務的價格高低。","選擇廠商時，只需考量其過往經驗，其他能力不重要。","考量受託者之專業能力與經驗、委外項目之性質及資通安全需求。","無需監督，全權交由廠商負責。"],"answer":"C","explanation":""},{"id":"p1-u08-q02","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"依據《資通安全管理法施行細則》第 7 條第 1 項，機關在選任及監督委外廠商時，哪些事項是需要注意的？","options":["評估廠商時，僅需確認其是否具備 ISO 9001 品質認證。","廠商只需提供過去的合作經驗，其他資安相關資料不需評估。","評估廠商的資安管理能力、確認資安專業人員、以及委託終止後的資料處理方式。","無需關注涉及國家機密的委託業務。"],"answer":"C","explanation":""},{"id":"p1-u08-q03","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"資訊委外主要分為四大類別，以下何者是屬於「顧問訓練類」的服務形態？","options":["ISMS 顧問輔導。","機房設施管理。","系統開發。","軟體即服務 (SaaS)。"],"answer":"A","explanation":""},{"id":"p1-u08-q04","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"為降低遠端維護的資安風險，機關應採取的原則與防護措施為何？","options":["原則允許、例外禁止。","原則禁止、例外允許，並應強化多因子鑑別。","無需額外防護措施。","遠端維護連線應該只在短天期內開放，不考慮其他條件。"],"answer":"B","explanation":""},{"id":"p1-u08-q05","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"資訊委外生命週期的「計畫階段」包含哪些關鍵步驟？","options":["決標與簽約。","完成建置與確認營運。","決定需求與識別可行解決方案。","驗收與保固。"],"answer":"C","explanation":""},{"id":"p1-u08-q06","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"在委外資安需求識別時，為何需要「識別委外廠商之限制」？","options":["識別限制只是為了增加招標流程的複雜性。","識別限制的目的完全在於確保廠商具備足夠的技術能力。","依據委外業務的敏感性和法規要求，對潛在廠商設定資格限制，特別是涉及國家機密或國家安全。","識別限制的唯一目的是篩選出價格最低的廠商。"],"answer":"C","explanation":""},{"id":"p1-u08-q07","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"在資訊委外生命週期的「招標階段」，資安管理重點著重在哪個方面？","options":["招標階段的資安管理重心完全放在廠商的價格競爭。","資安管理重點主要在於合約條款的法律審查，不涉及技術層面。","RFP 撰寫之完整度與評選準則中之資安要求符合度。","招標階段資安管理只針對最終解決方案進行選擇，不考慮前期要求。"],"answer":"C","explanation":""},{"id":"p1-u08-q08","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"在資訊委外「履約管理階段」中，機關應如何管理資訊委外的使用者存取？","options":["在專案初期授予委外人員最高權限，後續無需調整。","委外人員權限由廠商自行管理，機關無需介入。","機關只需透過電話確認委外人員的權限即可。","建立正式程序，從開始登記使用註冊，到最終不再需要存取資通系統與服務註銷。"],"answer":"D","explanation":""},{"id":"p1-u08-q09","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"在資訊委外「驗收階段」，若資通系統使用非委外廠商自行開發的第三方元件，機關應要求廠商揭露哪些資訊？","options":["揭露第三方程式元件之來源與授權證明，以確保其元件非來自大陸地區或其他限制地區。","廠商只需要揭露元件的功能說明，不需提供其他證明。","廠商只需要揭露元件的版本號，其他資訊不重要。","無需揭露，直接使用即可。"],"answer":"A","explanation":""},{"id":"p1-u08-q10","source":"part1 自我評量測驗v3","chapter":"第8單元：資訊委外安全管理","type":"single","question":"資訊委外專案「結束後」，機關應立即採取哪些資安措施？","options":["專案結束後，機關的主要任務是進行最終付款，其他資安措施可延後。","專案結束後，機關只需回收紙本文件，無需處理電子資料或存取權限。","立即停止委外廠商之實體與邏輯存取權限，並回收或銷毀屬於機關之資訊資產。","等待保固期結束再處理。"],"answer":"C","explanation":""},{"id":"p1-u09-q01","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"依據《資通安全事件通報及應變辦法》的「管理流程」，以下哪一個環節是事件發生「事前」應辦理的重要步驟？","options":["進行事件的初步分級與影響分析。","執行事件處理過程中的通報與應變措施。","對已發生的事件進行改善措施與分析總結。","應變計畫的演練與驗證。"],"answer":"D","explanation":""},{"id":"p1-u09-q02","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"資通安全事件等級評估時，若機關的「一般公務機密或敏感資訊」遭到「嚴重洩漏」，或「國家機密」遭到洩漏，其機密性應評估為哪個等級？","options":["第 1 級。","第 2 級。","第 3 級。","第 4 級。"],"answer":"D","explanation":""},{"id":"p1-u09-q03","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"在資通安全事件處理中，公務機關或特定非公務機關在「知悉」資安事件發生後，應在多久時間內「向上通報」相關事件資訊？","options":["1 小時內。","2 小時內。","4 小時內。","24 小時內。"],"answer":"A","explanation":""},{"id":"p1-u09-q04","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"發生「第 3 級或第 4 級」資安事件時，上級/監督機關或中央目的事業主管機關應在多久時間內完成審核作業？","options":["8 小時內。","4 小時內。","2 小時內。","1 小時內。"],"answer":"C","explanation":""},{"id":"p1-u09-q05","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"資通安全事件處理的「目的」之一是為了確保符合《資通安全管理法》等法律要求。此外，處理目的還包括哪些？","options":["資安事件處理的唯一目的就是追溯攻擊者身分。","僅為降低對業務與網路服務的中斷時間。","確認資安事件是否發生、提供精準及時資訊、保障由政策與法律要求的權利、實作控制措施以維護監管鏈。","處理資安事件主要目的是為了事後懲處相關人員。"],"answer":"C","explanation":""},{"id":"p1-u09-q06","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"資安事件處理後，應撰寫改善報告，其提交時限原則上為？","options":["3 天。","1 週。","1 個月。","1 年。"],"answer":"C","explanation":""},{"id":"p1-u09-q07","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"資安事件處理程序中的「封鎖 (Containment)」階段，主要目的是什麼？","options":["徹底清除惡意程式。","限制資安事件的擴散範圍，阻止損害進一步蔓延。","恢復受影響的系統和服務。","從事件中汲取教訓。"],"answer":"B","explanation":""},{"id":"p1-u09-q08","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"在處理個人資料外洩事件時，除了遵循標準處理程序外，個人資料在「復原」階段有何特殊要求？","options":["只需要對外發表道歉聲明，無需採取其他實質措施。","在復原階段，只需進行內部調查，不需通知外部受影響者。","應主動通知個資被外洩的對象，並提供改善方案防止進一步損害。","無需額外處理，等待受害者聯繫。"],"answer":"C","explanation":""},{"id":"p1-u09-q09","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"關於「數位證據」的特性，以下何者敘述正確？","options":["數位證據僅限於電子郵件和檔案。","數位證據的取得和保管無需特殊規範。","數位證據由電腦儲存或傳送，可用於偵查，並在法庭上具有具體用途。","數位證據一旦產生，其內容無法被改變。"],"answer":"C","explanation":""},{"id":"p1-u09-q10","source":"part1 自我評量測驗v3","chapter":"第9單元：資通安全事件通報及應變","type":"single","question":"社交工程攻擊主要利用了「人」的哪些弱點來達成其非法目的？","options":["社交工程攻擊完全是透過利用系統的技術漏洞來實現。","利用人性弱點，應用簡單的溝通與欺騙伎倆。","僅針對電腦系統進行攻擊。","需要具備頂尖的電腦專業技術。"],"answer":"B","explanation":""},{"id":"p2-q001","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"依據《資通安全管理法》第3條，資通系統的定義為何？","options":["用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統","僅限於政府機關所使用之電腦系統","用以監控網路流量之硬體設備","僅限於連接網際網路之伺服器設備"],"answer":"A","explanation":"依《資通安全管理法》第3條第1款，資通系統係指「用以蒐集、控制、傳輸、儲存、流通、刪除資訊或對資訊為其他處理、使用或分享之系統」，範圍涵蓋所有涉及資訊處理的軟硬體與網路環境。"},{"id":"p2-q002","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"下列何者不屬於資通系統的五大關鍵要素？","options":["資訊/資料","法規","網路","人員"],"answer":"B","explanation":"資通系統五大關鍵要素為：資訊/資料、軟體、硬體、網路、人員。「法規」雖然是資安管理的重要依據，但不屬於資通系統的組成要素。"},{"id":"p2-q003","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"依據 CNS 27002:2023 之資產分類，下列何者屬於「主要資產」？","options":["硬體設備","營運過程與活動","網路基礎設施","場域(Site)"],"answer":"B","explanation":"CNS 27002 將資產分為主要資產與支援資產。主要資產包括「資訊（含資料）」及「營運過程與活動」。硬體、軟體、網路、人員、場域、組織結構皆屬於支援資產。"},{"id":"p2-q004","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"「確保資訊在生命週期中持續正確、具一致性且可被信任，防止未經授權的修改或破壞」是指 CIA 中的哪一項？","options":["機密性(Confidentiality)","完整性(Integrity)","可用性(Availability)","法律遵循性(Legal Compliance)"],"answer":"B","explanation":"題目敘述完全對應完整性(Integrity)的定義：確保資訊正確、一致、可信任，防止未授權修改或破壞。"},{"id":"p2-q005","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"下列哪一種保護措施同時保護機密性、完整性及可用性三個目標？","options":["資料加解密","數位簽章","存取控制","負載平衡"],"answer":"C","explanation":"依教材圖5 CIA保護之不同防護技術與方法示意圖，「存取控制」同時出現在機密性、完整性及可用性三個目標的周圍，是唯一橫跨三者的保護措施。"},{"id":"p2-q006","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"某機關委外辦理推廣活動時，廠商直播不慎透漏抽獎網址，導致中獎人個資外洩。此事件主要影響 CIA 的哪一項？","options":["機密性","完整性","可用性","法律遵循性"],"answer":"A","explanation":"個人資料（姓名、手機）外洩是未經授權的資訊揭露，屬於機密性受損的典型案例。"},{"id":"p2-q007","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"某機關約300多台電腦的硬碟檔案因維護人員輸入錯誤代碼而被刪除，此事件主要影響 CIA 的哪一項？","options":["機密性","完整性","可用性","以上皆是"],"answer":"B","explanation":"資料因人為疏失被不當刪除（錯誤修改/破壞），是完整性受損的案例。教材在1.3.1(2)明確以此為完整性案例。"},{"id":"p2-q008","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"康芮颱風導致某機關因電壓不穩而系統服務中斷，此事件主要影響 CIA 的哪一項？","options":["機密性","完整性","可用性","法律遵循性"],"answer":"C","explanation":"天然災害導致系統服務中斷，使資訊無法被存取使用，是可用性受損的典型案例。"},{"id":"p2-q009","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"下列何者不是機密性的保護措施？","options":["資料加解密","存取控制","負載平衡","去識別化"],"answer":"C","explanation":"負載平衡是可用性的保護措施，用於將流量分散到多個伺服器以提高穩定性。機密性保護措施包括資料加解密、存取控制、資料遮罩、去識別化。"},{"id":"p2-q010","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"下列關於「法律遵循性」的敘述，何者正確？","options":["僅適用於公務機關","是 CIA 三目標之一","其主要法規包括資安法、個資法、國家機密保護法等","法律遵循性不涉及刑事責任"],"answer":"C","explanation":"法律遵循性是 CIA 之外的第四個資安防護目標（非 CIA 三目標之一），同時適用於公務機關及特定非公務機關，且違反可能涉及行政罰、懲戒乃至刑事責任。"},{"id":"p2-q011","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"下列何者最可能成為資安防護中最脆弱的環節？","options":["防火牆","加密技術","人員","作業系統"],"answer":"C","explanation":"教材強調人員是資通安全中「最常被忽略但卻至關重要的環節」，許多資安事件源於人為疏失或社交工程攻擊。"},{"id":"p2-q012","source":"part2 單選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"single","question":"資通服務與資通系統的主要差異為何？","options":["資通服務指的是提供硬體設備","資通服務指圍繞資通系統周邊的支援性活動","資通服務等同於資通系統","資通服務僅限於雲端服務"],"answer":"B","explanation":"依資安法第3條第2款，資通服務是「與資訊之蒐集、控制、傳輸等相關之服務」，是圍繞在資通系統周邊的支援性活動，例如個人電腦維護服務、伺服器維護服務等。"},{"id":"p2-q013","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"國家資通安全會報的召集人由誰擔任？","options":["行政院院長","行政院副院長","數位發展部部長","國家安全會議秘書長"],"answer":"AB","explanation":"國家資通安全會報之召集人由行政院院長或副院長兼任。副召集人為行政院院長指派之政務委員及主管機關首長1人(115年03月02日發布，國家資通安全會報設置辦法，第3條)。"},{"id":"p2-q014","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"我國資通安全管理體系中，負責「規劃」角色的是哪個機關？","options":["行政院","數位發展部","國家資通安全研究院","內政部"],"answer":"B","explanation":"在金字塔式層級架構中，行政院為決策機關，數位發展部為規劃機關，數位發展部指定資安專責機關為監管機關。"},{"id":"p2-q015","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"《資通安全管理法》不適用於下列哪一類機關？","options":["直轄市政府","軍事機關","公營事業","關鍵基礎設施提供者"],"answer":"B","explanation":"資安法明確規定「不包含軍事機關及情報機關」。軍事機關指國防部及所屬機關（構）、部隊、學校。"},{"id":"p2-q016","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"依《資通安全管理法》，特定非公務機關未依規定通報資安事件，罰鍰為多少？","options":["5萬至50萬元","10萬至100萬元","30萬至1,000萬元","50萬至5,000萬元"],"answer":"C","explanation":"依資安法第29條，特定非公務機關未通報資安事件，處罰鍰新臺幣30萬至1,000萬元，並令限期改正。"},{"id":"p2-q017","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"依《資通安全管理法施行細則》，「重大資通安全事件」是指哪些等級的事件？","options":["第一級及第二級","第二級及第三級","第三級及第四級","僅第四級"],"answer":"C","explanation":"115年01月05日發布，《資通安全管理法施行細則》第13條，重大資通安全事件係指依《資通安全事件通報應變及演練辦法》所定之第三級或第四級事件。"},{"id":"p2-q018","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"下列何者不是《資通安全管理法施行細則》第6條規定的資通安全維護計畫應包含項目？","options":["核心業務及其重要性","資通安全風險評估 (115.01.05改為資通安全風險管理)","員工年度績效考核","委外管理措施"],"answer":"C","explanation":"依115年01月05日發布《資通安全管理法施行細則》第9條，維護計畫應包含13項重點：核心業務、資安政策、組織、人力經費、資安長配置、系統盤點、風險管理、防護措施、通報應變演練、情資評估、委外管理、考核機制、精進績效管理。員工年度績效考核不在其中。"},{"id":"p2-q019","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"公務機關知悉資通安全事件後，應於多少時間內進行通報？","options":["30分鐘","1小時","2小時","4小時"],"answer":"B","explanation":"依115年01月05日發布《資通安全事件通報應變及演練辦法》第6條，公務機關知悉資通安全事件後，應於1小時內通報。"},{"id":"p2-q020","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"第三級或第四級資通安全事件，主管機關應於通報後多少時間內完成事件等級審核？","options":["1小時","2小時","8小時","24小時"],"answer":"B","explanation":"依115年01月05日發布《資通安全事件通報應變及演練辦法》第7條，通報為重大資通安全事件者，受通報機關(收受其實施情形之機關及主管機關)應於接獲後2小時內完成審核；第一、二級則為8小時內。"},{"id":"p2-q021","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"第一級或第二級資通安全事件，應於多少時間內完成損害控制或復原？","options":["24小時","36小時","72小時","1個月"],"answer":"C","explanation":"依115年01月05日發布《資通安全事件通報應變及演練辦法》第7條，第一、二級事件應於72小時內完成損害控制或復原；重大資通安全事件(第三、四級)則為36小時。"},{"id":"p2-q022","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"依《資通安全事件通報應變及演練辦法》，社交工程演練應多久辦理一次？","options":["每月1次","每季1次","每半年1次","每年1次"],"answer":"C","explanation":"依115年01月05日發布《資通安全事件通報應變及演練辦法》第10條，公務機關需每半年辦理1次社交工程演練。"},{"id":"p2-q023","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"《國家機密保護法》中，「極機密」的保密期限不得逾多少年？","options":["10年","20年","30年","永久"],"answer":"B","explanation":"國家機密三等級保密期限：絕對機密不得逾30年、極機密不得逾20年、機密不得逾10年。112年修法後取消永久保密。"},{"id":"p2-q024","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"《個人資料保護法》的主管機關為何？","options":["數位發展部","法務部","個人資料保護委員會","國家通訊傳播委員會"],"answer":"C","explanation":"《個人資料保護法》的主管機關為個人資料保護委員會。而《資通安全管理法》的主管機關則為數位發展部。《人工智慧基本法》的主管機關在中央為國家科學及技術委員會，在地方為直轄巿、縣(巿)政府。"},{"id":"p2-q025","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"下列關於《資通安全管理法》與《個人資料保護法》的比較，何者正確？","options":["兩法的主管機關相同","個資法僅適用於公務機關","資安法著重組織資安管理，個資法著重個人權益保護","兩法的適用對象完全相同"],"answer":"C","explanation":"資安法從組織層面出發，著重納管機關之資安管理作業；個資法從個人權益出發，著重個人資料的保護。兩者主管機關、適用對象均不同。"},{"id":"p2-q026","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"依《資通安全情資分享辦法》，下列何種情資不得分享？","options":["惡意偵察資訊","安全漏洞資訊","涉及營業秘密之資訊","偵測預防措施"],"answer":"C","explanation":"依辦法第4條，涉及營業秘密或依法應秘密者不得分享。但允許去除敏感部分後部分分享。"},{"id":"p2-q027","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"第七期國家資通安全發展方案的願景為何？","options":["建構零信任網路架構","建構韌性安全的數位社會","成為亞太資安中心","實現全面數位轉型"],"answer":"B","explanation":"第七期方案（114-117年）願景為「建構韌性安全的數位社會」。三大目標：強化全社會資安防禦韌性、豐富資安產業生態系、促進新興科技資安技術。"},{"id":"p2-q028","source":"part2 單選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"single","question":"依《資通安全管理法》114年修正版，下列何者為新增條文？","options":["資安責任等級分級","禁止公務機關使用危害國家資安產品","委外契約規範","資通安全維護計畫"],"answer":"B","explanation":"第11條為114年修正新增，規定公務機關禁止使用危害國家資安產品，訂定子法《危害國家資通安全產品審查辦法》，例外須經資安長核可並報主管機關核定。"},{"id":"p2-q029","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"資通安全風險管理中，「風險」的產生源於哪三個關鍵要素的交互作用？","options":["機密性、完整性、可用性","威脅、脆弱性、衝擊","識別、分析、評估","預防、偵測、回應"],"answer":"B","explanation":"風險產生於三個要素的交互作用：威脅(Threat)利用脆弱性(Vulnerability)，造成衝擊(Impact)。風險定義為「威脅利用相對應脆弱性，造成資訊資產受到衝擊的可能性」。"},{"id":"p2-q030","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"資通安全風險管理流程中，貫穿整個流程的環節是？","options":["風險評鑑","風險處理","風險溝通及諮詢","風險接受"],"answer":"C","explanation":"風險溝通及諮詢貫穿整個風險管理流程，需持續與內外部利害關係人進行溝通及諮詢。"},{"id":"p2-q031","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"高階風險評鑑是依據什麼原則來決定資通系統安全等級？","options":["ISO 27001標準","資通安全責任等級分級辦法之資通系統防護需求分級原則","NIST CSF框架","OWASP Top 10"],"answer":"B","explanation":"高階風險評鑑直接依據「資通安全責任等級分級辦法」之資通系統防護需求分級原則，決定資通系統安全等級（普/中/高）。"},{"id":"p2-q032","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"高階風險評鑑流程的最終核定者為誰？","options":["業務承辦人","承辦單位主管","資訊主管","資通安全長"],"answer":"D","explanation":"高階風險評鑑流程：業務承辦人設定影響構面等級 → 識別業務屬性 → 承辦單位主管檢視 → 資訊主管確認 → 資通安全長核定。"},{"id":"p2-q033","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"法律遵循性構面「高」等級的定義中，其法律責任程度為何？","options":["僅受行政罰","受行政罰或懲戒","使機關所屬人員負刑事責任","僅受罰鍰處分"],"answer":"C","explanation":"法律遵循性高等級：未遵循相關法令，可能使資通系統受影響而導致資安事件，並使機關所屬人員負刑事責任。中等級為行政罰、懲戒或懲處；普等級為一般法規規範。"},{"id":"p2-q034","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"下列哪一種風險處理策略是指「消除產生風險的活動或情境」？","options":["風險修改","風險留存","風險避免","風險分擔"],"answer":"C","explanation":"風險避免(Risk Avoidance)是消除產生風險的活動或情境，例如停用某個不安全的系統或停止某項業務。"},{"id":"p2-q035","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"將風險分擔給第三方（如購買保險）屬於哪一種風險處理策略？","options":["風險修改","風險留存","風險避免","風險分擔"],"answer":"D","explanation":"風險分擔(Risk Sharing/Transfer)是將風險分擔給第三方，如購買資安保險、委外給專業廠商等。但責任不能完全轉移，組織仍需履行監督義務。"},{"id":"p2-q036","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"NIST CSF 2.0 相較於 1.1 版本，最主要的新增功能為何？","options":["識別(Identify)","保護(Protect)","治理(Govern)","復原(Recover)"],"answer":"C","explanation":"NIST CSF 2.0 新增「治理(Govern, GV)」功能，強調資安治理是所有其他功能的基礎。2.0版共有六大核心功能：治理、識別、保護、偵測、回應、復原。"},{"id":"p2-q037","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"在建立風險管理全景時，下列何者屬於「外部環境」的考量？","options":["組織治理架構","人力與資源","新法規（如 GDPR）的影響","資安政策與目標"],"answer":"C","explanation":"外部環境包括社會、政治、法律、經濟、科技、自然等因素。新法規屬於法律環境的變化。組織治理架構、人力資源、資安政策屬於內部環境。"},{"id":"p2-q038","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"下列關於風險評鑑組織的敘述，何者正確？","options":["應僅由資訊部門負責執行","應由單一成員執行以確保一致性","應成立跨部門的風險評鑑組織","僅需納入資安專責人員"],"answer":"C","explanation":"風險評鑑不應僅是資訊部門的責任，應成立跨部門的風險評鑑組織，納入資訊、總務、人事、會計、業務承辦等人員，確保評鑑結果的客觀性與全面性。"},{"id":"p2-q039","source":"part2 單選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"single","question":"CNS 27005:2024 對應的國際標準為何？","options":["ISO/IEC 27001","ISO/IEC 27002","ISO/IEC 27005","ISO/IEC 22301"],"answer":"C","explanation":"CNS 27005:2024 對應 ISO/IEC 27005，是資訊安全風險管理的國家標準。CNS 27001對應ISO 27001(ISMS要求)，CNS 27002對應ISO 27002(控制措施)。"},{"id":"p2-q040","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"C級機關應於核定後多久內完成資通系統防護基準之控制措施？","options":["1年內","2年內","3年內","無要求"],"answer":"B","explanation":"依115年01月07日發布《資通安全責任等級分級辦法》附表五 資通安全責任等級C級之公務機關應辦事項辦理期限，C級機關分級需於1年內完成，控制措施需於2年內完成。A級及B級機關分級與控制措施均須於1年內完成。"},{"id":"p2-q041","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"資通系統防護基準共包含幾個構面？","options":["5個","7個","9個","11個"],"answer":"B","explanation":"防護基準共7大構面：\n存取控制(3項，帳號管理、最小權限、遠端存取)。\n事件日誌與可歸責性(6項，記錄事件、日誌紀錄內容、日誌儲存容量、日誌處理失效之回應、時戳及校時、日誌資訊之保護)。\n營運持續計畫(2項，資料備份、系統備援)。\n識別與鑑別(3項，使用者之識別與鑑別、身分驗證管理、鑑別資訊保護)。\n系統與服務獲得(8項，系統發展生命週期需求階段、設計階段、開發階段、測試階段、部署與維運階段、委外階段、獲得程序、系統文件)。\n系統與通訊保護(2項，傳輸之機密性與完整性、資料儲存之安全)。\n系統與資訊完整性(3項，漏洞修復、資通系統監控、軟體及資訊完整性)。"},{"id":"p2-q042","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"A級及B級機關須於核定後幾年內完成 ISMS 第三方驗證？","options":["1年","2年","3年","5年"],"answer":"C","explanation":"依115年01月07日發布《資通安全責任等級分級辦法》附表規定，A/B級機關須於核定後2年內導入ISMS，3年內完成公正第三方驗證，並持續維持有效性。C級僅需導入不需驗證。"},{"id":"p2-q043","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"CNS 27001:2023 附錄A中，「組織控制措施」共有幾項？","options":["8項","14項","34項","37項"],"answer":"D","explanation":"附錄A四大類控制措施：A.5 組織控制措施(37項)、A.6 人員控制措施(8項)、A.7 實體控制措施(14項)、A.8 技術控制措施(34項)，合計93項。"},{"id":"p2-q044","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"B級公務機關應配置多少名資通安全專責人員？","options":["1人","2人","4人","無要求"],"answer":"B","explanation":"A級4人、B級2人、C級1人，均須以專職人員配置。D/E級無要求。"},{"id":"p2-q045","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"A級機關的內部資通安全稽核應多久辦理一次？","options":["每季1次","每半年1次","每年2次","每年1次"],"answer":"C","explanation":"A級每年辦理2次（等同每半年1次）、B級每年1次、C級每2年1次、D/E級無要求。"},{"id":"p2-q046","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"MTPD 的計算公式為何？","options":["MTPD = RPO + RTO","MTPD = RTO + WRT","MTPD = RPO + WRT","MTPD = RTO × 2"],"answer":"B","explanation":"MTPD（最大可容忍中斷時間）= RTO（復原時間目標）+ WRT（工作復原時間）。"},{"id":"p2-q047","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"下列何者不是 BIA（營運衝擊分析）的步驟？","options":["識別機關核心業務功能","計算核心業務可容許缺少資源的時間","確認業務功能與資源復原的先後順序","購買資安保險"],"answer":"D","explanation":"BIA六步驟：識別核心業務→識別依賴資源→計算可容許缺少資源時間→識別威脅與弱點→計算風險→確認復原先後順序。購買保險屬於風險分擔策略。"},{"id":"p2-q048","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"資安治理成熟度評估中，A級機關應達到第幾等級以上？","options":["第1等級（基礎型）","第2等級（管理型）","第3等級（制度化型）","第4等級（可預測型）"],"answer":"C","explanation":"A級機關應達第3等級（制度化型/Established）以上；B級應達第2等級（管理型/Managed）以上。C/D/E級無要求。"},{"id":"p2-q049","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"在成熟度計算中，若某機關 Level 3 對應的 T3 流程構面能力度僅為 2，該機關最高可達到的成熟度為？","options":["Level 1","Level 2","Level 3","Level 4"],"answer":"B","explanation":"成熟度計算原則：從Level 1往上逐級檢查，該級及以下所有流程構面的能力度等級都要≥該級別數字。若T3(Level 3構面)能力度僅為2，未達3，故最高只能達Level 2。"},{"id":"p2-q050","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"資通安全專職人員每年應接受至少多少小時的專業課程訓練？","options":["3小時","6小時","12小時","24小時"],"answer":"C","explanation":"資安專職人員每年至少12小時專業訓練（A/B/C級機關要求）。一般使用者及主管每年至少3小時通識教育。"},{"id":"p2-q051","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"A級機關核定後1年內，至少需幾名人員持有資通安全專業證照及職能訓練證書？","options":["1名","2名","4名","6名"],"answer":"C","explanation":"A級至少4名、B級至少2名、C級至少1名，需持有證照及證書各1張以上，並持續維持有效性。"},{"id":"p2-q052","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"下列何者屬於第二方稽核？","options":["機關內部自我檢查","上級機關稽核下級機關","第三方ISMS驗證","iPAS認證考試"],"answer":"B","explanation":"第一方稽核=內部資安稽核；第二方稽核=上級稽核下級或機關稽核委外廠商；第三方稽核=公正第三方ISMS驗證（CNS 27001）。"},{"id":"p2-q053","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"業務持續運作演練中，A級機關全部核心資通系統應多久演練一次？","options":["每季","每半年","每年1次","每2年1次"],"answer":"C","explanation":"A級每年辦理1次；B級、C級每2年辦理1次；D/E級無要求。"},{"id":"p2-q054","source":"part2 單選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"single","question":"在資安治理架構中，「S」代表哪個面向？","options":["安全面(Security)","策略面(Strategy)","系統面(System)","服務面(Service)"],"answer":"B","explanation":"資安治理架構三個面向：S=策略面(Strategy)、M=管理面(Management)、T=技術面(Technical)。"},{"id":"p2-q055","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"依資通系統防護基準，「最小權限原則」適用於哪些等級的資通系統？","options":["高、中、普三等級","僅高等級","高、中等級","僅中等級"],"answer":"AC","explanation":"1115年01月07日發布，《資通安全責任等級分級辦法》附表十 資通系統防護基準及數發部資通系統防護基準驗證實務v1.2版，最小權限原則適用於高、中、普等級資通系統。"},{"id":"p2-q056","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"下列何者不屬於存取控制的授權原則？","options":["業務僅知原則(Need-to-Know)","最小權限原則(Least Privilege)","職務區隔(Separation of Duties)","完整備份原則(Full Backup)"],"answer":"D","explanation":"存取控制授權四原則：業務僅知原則、最小權限原則、職務區隔、特殊權限管理。完整備份屬於營運持續計畫。"},{"id":"p2-q057","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"事件日誌應至少保留多久？","options":["1個月","3個月","6個月","1年"],"answer":"C","explanation":"依資通系統防護基準，日誌應訂定記錄時間週期及留存政策，並保留日誌至少6個月。"},{"id":"p2-q058","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"下列何者不屬於日誌記錄應包含的資訊？","options":["事件類型","使用者密碼原文","發生時間","使用者身分識別"],"answer":"B","explanation":"日誌應包含事件類型、發生時間、發生位置及使用者身分識別等資訊。密碼原文不應記錄在日誌中，這會違反機密性原則。"},{"id":"p2-q059","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"高等級資通系統在日誌處理失效時，應採取什麼行動？","options":["自動關閉系統","於機關規定時效內對特定人員提出警告","忽略並繼續運作","自動刪除舊日誌"],"answer":"B","explanation":"115年01月07日發布，《資通安全責任等級分級辦法》附表十 資通系統防護基準及數發部資通系統防護基準驗證實務v1.2版，普/中/高等級系統在日誌處理失效時，應於機關規定時效內對特定人員提出警告，確保安全監控不中斷。"},{"id":"p2-q060","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"關於 RPO 與備份頻率的關係，下列敘述何者正確？","options":["備份週期可以大於 RPO","備份週期不可大於 RPO","備份週期與 RPO 無關","RPO 越大，備份越頻繁"],"answer":"B","explanation":"備份週期不可大於RPO。例如RPO為4小時，則備份至少每4小時進行一次，以確保資料損失不超過可容忍範圍。"},{"id":"p2-q061","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"高等級資通系統的異地備份，主機房與異地備援機房距離建議應達多少？","options":["5公里以上","10公里以上","30公里以上","100公里以上"],"answer":"C","explanation":"依教材引用「我國電腦機房異地備援機制參考指引」，主機房與異地備援機房距離應30公里以上。"},{"id":"p2-q062","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"依防護基準，帳號登入身分驗證失敗達幾次後，至少15分鐘內不允許該帳號繼續嘗試登入？","options":["3次","5次","10次","15次"],"answer":"B","explanation":"普等級即要求：帳號登入進行身分驗證失敗達5次後，至少15分鐘內不允許該帳號繼續嘗試登入。"},{"id":"p2-q063","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"高等級資通系統在身分識別與鑑別方面，相較於中、普等級多了什麼要求？","options":["密碼複雜度要求","帳戶鎖定機制","多重認證技術(MFA)","預設密碼變更"],"answer":"C","explanation":"高等級額外要求：對資通系統之存取採取多重認證技術(MFA)。密碼複雜度、帳戶鎖定、預設密碼變更在普等級即已要求。"},{"id":"p2-q064","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"關於資料備份類型，下列何者的還原過程最為複雜？","options":["完整備份","差異備份","增量備份","鏡像備份"],"answer":"C","explanation":"增量備份速度最快、佔空間最少，但還原最複雜，需依序套用完整備份+所有增量備份。差異備份僅需完整備份+最近一次差異備份。"},{"id":"p2-q065","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"差異備份是備份自上次什麼備份之後變更的檔案？","options":["上次增量備份","上次差異備份","上次完整備份","上次任何備份"],"answer":"C","explanation":"差異備份=備份自上次「完整備份」後變更或新增的檔案。增量備份=備份自上次「任何備份」（完整或增量）後變更的檔案。"},{"id":"p2-q066","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"HDD（傳統硬碟）的安全資料刪除方式為何？","options":["僅刪除檔案指標","格式化即可","單次覆寫（如所有0或隨機字元）","消磁設備"],"answer":"C","explanation":"HDD安全刪除：以所有0或隨機字元覆蓋所有儲存空間（NIST認為一次覆寫對現代HDD已足夠）。僅刪除檔案或格式化不夠安全。消磁適用於報廢銷毀。"},{"id":"p2-q067","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"SSD（固態硬碟）最快最有效的安全資料刪除方式為何？","options":["單次覆寫","加密式清除(刪除加密金鑰)","消磁","碎裂(6mm)"],"answer":"B","explanation":"SSD的加密式清除(Cryptographic Erase, CE)：刪除加密金鑰使資料不可讀取，是最快最有效的方法。注意：消磁對SSD無效。"},{"id":"p2-q068","source":"part2 單選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"雜湊函式(Hash)的下列特性，何者錯誤？","options":["固定長度輸出","單向性（不可逆）","可由雜湊值回推原始資料","抗碰撞性"],"answer":"C","explanation":"雜湊函式的核心特性之一就是「單向性」——無法從雜湊值回推原始資料。選項C的敘述與單向性矛盾，故為錯誤選項。"},{"id":"p2-q069","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"下列何者是獨立運行、能透過網路自我複製與傳播的惡意程式？","options":["病毒(Virus)","蠕蟲(Worm)","木馬程式(Trojan Horse)","間諜軟體(Spyware)"],"answer":"B","explanation":"蠕蟲(Worm)獨立運行，透過網路自我複製傳播，不需使用者互動。病毒需感染其他程式；木馬偽裝成合法軟體；間諜軟體秘密監控。"},{"id":"p2-q070","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"防毒軟體部署中，位於 DMZ 網段的是哪一種？","options":["個人電腦防毒","電子郵件防毒閘道(SMTP AntiVirus)","上網防毒閘道","伺服器防毒"],"answer":"B","explanation":"電子郵件防毒閘道(SMTP AntiVirus)位於DMZ網段，在郵件進入內部網路前進行掃描過濾。上網防毒閘道則位於內部網路與網際網路之間。"},{"id":"p2-q071","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"下列關於 IDS 與 IPS 的比較，何者正確？","options":["IDS 串聯部署，IPS 旁路部署","IDS 被動偵測通報，IPS 主動偵測阻擋","IDS 可自動阻擋攻擊","IPS 僅發出警報不採取行動"],"answer":"B","explanation":"IDS旁路監聽(Mirror)，被動偵測並通報；IPS串聯(Inline)，主動偵測並自動阻擋。"},{"id":"p2-q072","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"WAF（應用程式防火牆）主要保護哪一層的安全？","options":["網路層","傳輸層","應用層（Web應用程式）","實體層"],"answer":"C","explanation":"WAF專門保護Web應用程式（應用層），防禦SQL Injection、XSS、CSRF等應用層攻擊。一般網路防火牆主要工作於網路層/傳輸層。"},{"id":"p2-q073","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"APT（進階持續性威脅）攻擊的最大特色不包括下列何者？","options":["針對性","持續性","隨機性","隱匿性"],"answer":"C","explanation":"APT的特色為：針對性（鎖定特定目標）、持續性（長期潛伏）、隱匿性（難以偵測）、多階段（偵察→入侵→潛伏→擴散→竊取）。APT不具隨機性。"},{"id":"p2-q074","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"SOC 的核心目標不包括下列何者？","options":["持續監控","事件偵測","程式碼開發","事件回應"],"answer":"C","explanation":"SOC（資通安全威脅偵測管理機制）核心目標：持續監控、事件偵測、事件回應。程式碼開發不屬於SOC職責。"},{"id":"p2-q075","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"GCB（政府組態基準）的主要目的為何？","options":["偵測入侵行為","統一政府機關電腦組態設定標準","加密網路傳輸","管理數位憑證"],"answer":"B","explanation":"GCB用於統一政府機關電腦組態設定標準（作業系統、瀏覽器、辦公軟體等），降低因錯誤設定導致的資安風險。"},{"id":"p2-q076","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"VANS（政府機關資安弱點通報機制）的資訊資產涵蓋範圍共有幾層？","options":["2層","3層","4層","5層"],"answer":"C","explanation":"VANS涵蓋四層：應用系統、應用程式中介軟體(Middleware)、作業系統、網路設備（含韌體層）。"},{"id":"p2-q077","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"EDR（端點偵測及回應系統）相較於傳統防毒軟體，其主要優勢為何？","options":["更便宜","能識別更複雜的攻擊行為如無檔案攻擊、零日漏洞","不需安裝在端點設備","僅處理已知威脅"],"answer":"B","explanation":"EDR超越傳統防毒，能識別無檔案攻擊、勒索軟體、零日漏洞利用和APT攻擊等複雜威脅。傳統防毒主要依靠特徵碼比對處理已知威脅。"},{"id":"p2-q078","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"下列何者不是 EDR 使用的技術？","options":["行為分析","規則比對","黑白名單","資料庫正規化"],"answer":"D","explanation":"EDR三大技術：行為分析（監控進程、檔案操作等）、規則比對（與已知惡意行為規則集比對）、黑白名單（阻止/允許已知程式）。資料庫正規化屬於資料管理技術。"},{"id":"p2-q079","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"傳統 IDS/IPS 面對 SSL/TLS 加密流量時的主要限制為何？","options":["無法處理大量流量","無法檢測加密流量內容","無法部署在網路邊界","無法發出警報"],"answer":"B","explanation":"傳統IDS/IPS無法檢視加密流量內容，因為資料已被加密。需搭配SSL解密機制或NGFW的統一管線才能檢測加密流量。"},{"id":"p2-q080","source":"part2 單選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"single","question":"下列何者是 NGFW（次世代防火牆）整合的功能？","options":["僅封包過濾","封包過濾 + IPS + 應用程式辨識 + SSL解密","僅應用層閘道","僅狀態檢測"],"answer":"B","explanation":"NGFW整合多種功能：封包過濾、IPS入侵防禦、應用程式辨識、SSL解密、威脅情資等，提供更全面的防護。"},{"id":"p2-q081","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"A級機關的弱點掃描應多久辦理一次？","options":["每月1次","每季1次","每年2次","每年1次"],"answer":"C","explanation":"A級每年2次弱點掃描、每年1次滲透測試。B級每年1次弱點掃描、每2年1次滲透測試。C級弱點掃描與滲透測試皆為每2年1次。"},{"id":"p2-q082","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"B級機關的滲透測試應多久辦理一次？","options":["每年2次","每年1次","每2年1次","無要求"],"answer":"C","explanation":"B級機關滲透測試每2年1次。A級每年1次。C級每2年1次。D/E級無要求。"},{"id":"p2-q083","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"依 OWASP Top 10:2021，排名第一的弱點為何？","options":["注入式攻擊(Injection)","權限控制失效(Broken Access Control)","加密失敗(Cryptographic Failures)","不安全設計(Insecure Design)"],"answer":"B","explanation":"OWASP Top 10:2021 排名：A01 權限控制失效(Broken Access Control)排名第一。注入式攻擊降至A03。"},{"id":"p2-q084","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"下列何者不屬於 OWASP Top 10:2021 的項目？","options":["安全設定錯誤","緩衝區溢位(Buffer Overflow)","伺服器端請求偽造(SSRF)","軟體及資料完整性失效"],"answer":"B","explanation":"緩衝區溢位不在OWASP Top 10:2021清單中。A10是SSRF（伺服器端請求偽造），為2021版新增項目。"},{"id":"p2-q085","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"模擬外部攻擊者，不提供任何系統資訊的滲透測試類型為？","options":["白箱測試","灰箱測試","黑箱測試","迴歸測試"],"answer":"C","explanation":"黑箱測試=不提供任何資訊，模擬外部攻擊者。白箱測試=提供完整資訊。灰箱測試=提供部分資訊。"},{"id":"p2-q086","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"資通安全健診的辦理頻率，A級機關應多久辦理一次？","options":["每半年1次","每年1次","每2年1次","每3年1次"],"answer":"B","explanation":"A級每年1次資安健診，B級、C級每2年1次，D級以下無要求。"},{"id":"p2-q087","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"下列何者不是資通安全健診的項目？","options":["網路架構檢視","伺服器主機檢視","原始碼審查","防火牆連線設定檢視"],"answer":"C","explanation":"健診項目包括：網路架構檢視、網路惡意活動檢視、使用者端電腦檢視、伺服器主機檢視、目錄伺服器設定檢視、防火牆連線設定檢視。原始碼審查屬於應用程式安全檢測（SAST）。"},{"id":"p2-q088","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"DMZ（非軍事區）的主要用途為何？","options":["存放內部資料庫","作為隔離區放置對外提供服務的伺服器","作為員工辦公區域的網路","存放備份資料"],"answer":"B","explanation":"DMZ是隔離區，專門放置需要對外部網路提供服務的伺服器。即使DMZ內的伺服器被攻擊，攻擊者仍需再突破防火牆才能進入更敏感的內部網路。"},{"id":"p2-q089","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"資訊機房發生火災時，不應使用哪種滅火方式？","options":["BC類乾粉","CO2滅火器","水（灑水系統）","FM-200氣體"],"answer":"C","explanation":"機房為電氣設備密集區域（C類火災），不可使用水滅火（會造成短路及設備損壞）。應使用氣體滅火系統如FM-200、CO2或乾粉。"},{"id":"p2-q090","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"機房漏水偵測器應部署在哪些位置？","options":["僅門口","高架地板下及天花板","僅伺服器旁","僅消防設備旁"],"answer":"B","explanation":"漏水偵測器應放置在關鍵位置：高架地板下（線纜管線通道，最可能積水處）和天花板（可能有水管或空調系統漏水）。"},{"id":"p2-q091","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"弱點掃描的推動與執行應遵循什麼管理循環？","options":["SWOT分析","PDCA循環","DMAIC方法","敏捷開發"],"answer":"B","explanation":"弱點掃描應遵循PDCA (Plan-Do-Check-Act)循環，確保資安工作具備系統性與持續改善的有效性。"},{"id":"p2-q092","source":"part2 單選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"single","question":"火災分類中，「B類火災」的可燃物為何？","options":["木材、紙張","石油、溶劑、酒精","電器設備、電路","鎂、鈉、鉀"],"answer":"B","explanation":"A類=普通火災(木紙塑膠)；B類=油類火災(石油、溶劑、酒精)；C類=電氣火災(電器設備)；D類=金屬火災(鎂鈉鉀)。"},{"id":"p2-q093","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"依《資通安全管理法施行細則》第7條，機關委外資通業務時，下列何者不是選任受託者時應考量的因素？","options":["受託者之專業能力與經驗","委外項目之性質","受託者的股票市值","資通安全需求"],"answer":"C","explanation":"資安法第10條規定應考量：受託者之專業能力與經驗、委外項目之性質、資通安全需求。受託者股票市值不在法定考量因素中。"},{"id":"p2-q094","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"依施行細則第7條，受託業務包括客製化資通系統開發者，若委託金額達多少以上，委託機關應自行或另行委託第三方進行安全性檢測？","options":["100萬元","500萬元","1,000萬元","5,000萬元"],"answer":"C","explanation":"若為核心資通系統或委託金額達新臺幣1,000萬元以上者，委託機關應自行或另行委託第三方進行安全性檢測。"},{"id":"p2-q095","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"委託關係終止時，應確認受託者對履約而持有的資料採取什麼處理？","options":["繼續保留備用","返還、移交、刪除或銷毀","轉交給其他廠商","公開發布"],"answer":"B","explanation":"依施行細則第7條第6款，委託關係終止或解除時，應確認受託者返還、移交、刪除或銷毀履行契約而持有之資料。"},{"id":"p2-q096","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"資訊委外生命週期中，將資安需求轉化為契約義務的關鍵階段是？","options":["計畫階段","招標階段","決標階段","驗收階段"],"answer":"B","explanation":"招標階段是將「資安需求」轉化為「契約義務」的關鍵橋樑。重點在於RFP撰寫之完整度與評選準則中之資安要求符合度。"},{"id":"p2-q097","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"資訊委外履約管理階段中，下列何者不是應注意的面向？","options":["資通安全組織","持續性風險識別","資訊委外資通安全事件管理","廠商股東結構變更"],"answer":"D","explanation":"履約管理七面向：資通安全組織、持續性風險識別、人力資源安全、實體與環境安全、日常管理、使用者存取管理、資通安全事件管理。廠商股東結構不在此列。"},{"id":"p2-q098","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"關於委外廠商的稽核優先判斷標準，下列何者正確？","options":["僅考量委外金額","僅考量是否涉及核心系統","綜合考量委外金額、涉及核心系統及業務性質敏感性","依廠商員工人數決定"],"answer":"C","explanation":"稽核優先判斷標準應綜合考量：委外金額（金額越大風險越高）、涉及核心系統（影響核心業務的優先）、業務性質敏感性（處理個資或機密的更嚴格）。"},{"id":"p2-q099","source":"part2 單選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"single","question":"委外業務涉及國家機密者，對執行人員有什麼額外要求？","options":["無額外要求","應接受適任性查核並管制出境","僅需簽署保密協議","僅需具備資安證照"],"answer":"B","explanation":"依施行細則第4條第4款，受託業務涉及國家機密者，執行受託業務之相關人員應接受適任性查核，並依《國家機密保護法》之規定，管制出境。"},{"id":"p2-q100","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"依《資通安全事件通報應變及演練辦法》，資通安全事件共分為幾級？","options":["2級","3級","4級","5級"],"answer":"C","explanation":"資通安全事件分為4級，依影響程度與範圍劃分。第一級最輕微，第四級最嚴重。第三、四級為重大事件。"},{"id":"p2-q101","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"第三級資通安全事件應於多少時間內完成損害控制或復原？","options":["12小時","24小時","36小時","72小時"],"answer":"C","explanation":"第三、四級（重大事件）應於36小時內完成損害控制或復原。第一、二級為72小時。"},{"id":"p2-q102","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"資通安全事件發生後，調查、處理及改善報告應於多久內提出？","options":["1週內","2週內","1個月內","3個月內"],"answer":"C","explanation":"依辦法規定，應於事件處理後1個月內提交調查、處理及改善報告。"},{"id":"p2-q103","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"演練完成後，成果報告應於多久內提交？","options":["1週內","1個月內","2個月內","3個月內"],"answer":"B","explanation":"各類演練完成後1個月內提交成果報告。"},{"id":"p2-q104","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"下列何者不屬於資通安全事件通報應包含的內容？","options":["發生機關","事件等級評估","外部支援需求","受影響系統的原始碼"],"answer":"D","explanation":"通報內容包括：發生機關、時間、狀況描述、等級評估、應對措施、外部支援需求及其他事項。原始碼不在通報範圍內。"},{"id":"p2-q105","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"數位鑑識中，蒐集數位證據時應使用什麼裝置以防止證據被污染？","options":["防火牆","寫保護裝置(Write Blocker)","負載平衡器","VPN"],"answer":"B","explanation":"數位證據具有脆弱易變、易遭竄改的特性，蒐集時需使用寫保護裝置(Write Blocker)防止對原始證據的寫入，並計算雜湊值驗證完整性。"},{"id":"p2-q106","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"數位鑑識的正確流程順序為何？","options":["分析→蒐集→保全→報告→識別","識別→蒐集→保全→分析→報告","蒐集→識別→分析→保全→報告","報告→識別→蒐集→分析→保全"],"answer":"B","explanation":"數位鑑識流程：證據識別→蒐集→保全→分析→報告。"},{"id":"p2-q107","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"社交工程攻擊的主要目標為何？","options":["系統漏洞","網路設備","人（利用人性弱點）","加密金鑰"],"answer":"C","explanation":"社交工程攻擊的主要目標是「人」而非「系統」，利用人性弱點（信任、恐懼、急迫感）騙取機密資訊。"},{"id":"p2-q108","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"下列何者不屬於社交工程的攻擊手法？","options":["釣魚郵件","電話詐騙","SQL Injection","尾隨進入"],"answer":"C","explanation":"SQL Injection是技術性的注入式攻擊，不屬於社交工程。社交工程手法包括：釣魚郵件、電話詐騙、尾隨進入、肩窺、假冒身分等，均以「人」為目標。"},{"id":"p2-q109","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"資通安全事件處理的六步驟中，在「偵測與分析」之後應進行的是？","options":["準備","損害控制","根除","復原"],"answer":"B","explanation":"事件處理六步驟：準備→偵測與分析→損害控制→根除→復原→後續處理。損害控制緊接在偵測分析之後。"},{"id":"p2-q110","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"下列何者是「監管鏈(Chain of Custody)」的目的？","options":["加密傳輸資料","追蹤數位證據從蒐集到法庭呈堂的完整過程","建立VPN連線","進行弱點掃描"],"answer":"B","explanation":"監管鏈(Chain of Custody)是追蹤數位證據從蒐集、保全、分析到法庭呈堂的完整過程，確保證據的合法性與可信度。"},{"id":"p2-q111","source":"part2 單選題模擬試題","chapter":"單元九｜資通安全事件通報應變及演練","type":"single","question":"第四級資通安全事件，主管機關應於通報後多少時間內完成審核？","options":["30分鐘","1小時","2小時","4小時"],"answer":"C","explanation":"第三、四級（重大事件）主管機關應於通報後2小時內完成審核。第一、二級為8小時。"},{"id":"p3-q01","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"下列何者屬於 CNS 27002:2023 定義的「支援資產」？","options":["硬體","營運過程與活動","人員","場域(Site)"],"answer":"ACD","explanation":"支援資產包括硬體、軟體、網路、人員、場域(Site)及組織結構。「營運過程與活動」屬於主要資產，另一項主要資產為「資訊（含資料）」。"},{"id":"p3-q02","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"下列哪些屬於「可用性」的保護措施？","options":["負載平衡","資料加解密","系統備援","容量規劃"],"answer":"ACD","explanation":"可用性保護措施：存取控制、負載平衡、資料備份、容量規劃、系統備援、系統監控、UPS等。資料加解密屬於機密性保護措施。"},{"id":"p3-q03","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"下列哪些屬於「完整性」的保護措施？","options":["數位簽章","雜湊函數","去識別化","資料驗證"],"answer":"ABD","explanation":"完整性保護措施：存取控制、雜湊函數、數位簽章、資料驗證、版本控制、稽核追蹤。去識別化屬於機密性保護措施。"},{"id":"p3-q04","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"關於資通安全之 CIA 三目標，下列敘述何者正確？","options":["機密性是確保資訊不被未授權者存取","完整性是確保系統服務不中斷","可用性是確保授權使用者在需要時可存取資源","法律遵循性是 CIA 三目標之一"],"answer":"AC","explanation":"B錯：完整性是確保資訊正確一致不被竄改，不是確保不中斷（那是可用性）。D錯：法律遵循性是 CIA 之外的第四個防護目標，非 CIA 三目標之一。"},{"id":"p3-q05","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"下列哪些情境屬於「機密性」受損？","options":["機關直播不慎透漏個資","駭客竊取商業機密","資料遭駐點工程師誤刪","颱風導致系統停機"],"answer":"AB","explanation":"A/B均為資訊被未授權揭露或竊取，屬機密性受損。C為完整性受損（資料被不當修改/刪除）。D為可用性受損（服務中斷）。"},{"id":"p3-q06","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"下列何者屬於資通系統的五大關鍵要素？","options":["資訊/資料","法規","人員","硬體"],"answer":"ACD","explanation":"五大關鍵要素：資訊/資料、軟體、硬體、網路、人員。法規是資安管理的依據，不屬於資通系統的組成要素。"},{"id":"p3-q07","source":"part3 複選題模擬試題","chapter":"單元一｜資通安全基本概念","type":"multiple","question":"關於資安威脅的潛在影響，下列敘述何者正確？","options":["醫院資訊系統癱瘓可能危及生命","關鍵基礎設施遭攻擊可能危及國家安全","IoT 裝置設計之初通常已充分考慮資安","資安僅為資安專業人員的責任"],"answer":"AB","explanation":"C錯：教材明確指出許多IoT裝置「設計之初並未充分考慮資安問題」。D錯：教材強調「資安是每一個人的責任」，為現代公民基本素養。"},{"id":"p3-q08","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"下列何者屬於《資通安全管理法》之「特定非公務機關」？","options":["關鍵基礎設施提供者","軍事機關","公營事業","特定財團法人"],"answer":"ACD","explanation":"特定非公務機關包括：關鍵基礎設施提供者、公營事業、特定財團法人、受政府控制之事業。軍事機關及情報機關不適用資安法。"},{"id":"p3-q09","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"依《資通安全管理法》，公務機關及特定非公務機關「事前」應辦的義務有哪些？","options":["訂定資通安全維護計畫","訂定通報及應變機制","接受資通安全稽核","提出改善報告"],"answer":"AB","explanation":"事前義務：訂定維護計畫+訂定通報應變機制。事中：接受稽核+提出實施情形+通報應變。事後：提出改善報告+提出調查處理及改善報告。"},{"id":"p3-q10","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"依《資通安全事件通報及應變辦法》，下列敘述何者正確？","options":["社交工程演練每半年1次","通報應變演練每年1次","知悉事件後應於2小時內通報","第三、四級事件審核時限為2小時"],"answer":"ABD","explanation":"C錯：知悉事件後應於「1小時內」通報（非2小時）。A/B/D均正確。演練完成後1個月內提交成果報告。"},{"id":"p3-q11","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"下列關於國家機密保護法的敘述，何者正確？","options":["絕對機密保密期限不得逾30年","機密保密期限不得逾10年","核定權責人員應於60日內完成核定","112年修法後取消永久保密"],"answer":"ABD","explanation":"C錯：核定權責人員應於接獲報請後「30日內」完成核定（非60日）。三級保密期限：絕對機密30年、極機密20年、機密10年。"},{"id":"p3-q12","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"下列關於六大子法的敘述，何者正確？","options":["資通安全責任等級分級辦法將機關分為A/B/C/D/E五級","施行細則定義重大事件為第二、三級事件","情資分享辦法規定涉及營業秘密之情資不得分享","公務機關所屬人員獎懲辦法規定懲處前應給予申辯機會"],"answer":"ACD","explanation":"B錯：重大事件為「第三、四級」事件（非第二、三級）。"},{"id":"p3-q13","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"《資通安全管理法》114年修正版新增了哪些條文？","options":["禁止公務機關使用危害國家資安產品","特定非公務機關應設置資通安全長","資安事件涉及個資外洩應另依個資法辦理","取消所有罰鍰規定"],"answer":"ABC","explanation":"D錯：修正版反而提高了罰鍰上限（未通報30萬至1,000萬元；違反維護計畫等10萬至500萬元）。A為第11條、B為第23條、C為第33條，均為新增。"},{"id":"p3-q14","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"下列關於《資通安全管理法》與《個人資料保護法》的比較，何者正確？","options":["兩法主管機關不同","個資法適用對象範圍比資安法更廣","資安法著重組織資安管理","兩法的適用對象完全相同"],"answer":"ABC","explanation":"D錯：資安法僅適用公務機關+特定非公務機關，個資法適用所有公務/非公務機關（含自然人），範圍更廣。A正確：資安法=數位發展部，個資法=個人資料保護委員會。"},{"id":"p3-q15","source":"part3 複選題模擬試題","chapter":"單元二｜資通安全相關法規","type":"multiple","question":"第七期國家資通安全發展方案的三大目標包括？","options":["強化全社會資安防禦韌性","豐富資安產業生態系","全面禁止境外軟體使用","促進新興科技資安技術的發展與應用"],"answer":"ABD","explanation":"C為虛構選項。三大目標：強化全社會資安防禦韌性、豐富資安產業生態系、促進新興科技資安技術的發展與應用。"},{"id":"p3-q16","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"資通安全風險管理流程包含哪些主要階段？","options":["風險溝通及諮詢","風險評鑑","風險處理","風險消除"],"answer":"ABC","explanation":"風險管理流程：風險溝通及諮詢（貫穿全程）→ 全景建立 → 風險評鑑 → 風險處理 → 風險接受 → 風險監視與審查。「風險消除」非正式術語，正確用語為「風險避免」（為風險處理策略之一）。"},{"id":"p3-q17","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"下列關於高階風險評鑑的敘述，何者正確？","options":["依資通系統防護需求分級原則進行","評鑑四構面為機密性、完整性、可用性、法律遵循性","需要詳細識別所有資產的威脅與弱點","最終由資通安全長核定安全等級"],"answer":"ABD","explanation":"C錯：詳細識別資產威脅與弱點是「詳細風險評鑑」的作法。高階風險評鑑是快速簡便的方法，直接依分級原則決定安全等級。"},{"id":"p3-q18","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"風險處理的四大策略包括哪些？","options":["風險修改","風險留存","風險消滅","風險分擔"],"answer":"ABD","explanation":"四大策略：風險修改（導入控制措施）、風險留存/保有（接受風險）、風險避免（消除風險活動）、風險分擔/轉移（分擔給第三方）。「風險消滅」非正式策略名稱。"},{"id":"p3-q19","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"關於風險管理全景建立中的「外部環境」，下列何者應納入考量？","options":["新法規（如GDPR）的影響","自然災害（如地震、颱風）","組織內部的治理架構","經濟環境的變化"],"answer":"ABD","explanation":"外部環境包括社會、政治、法律、經濟、科技、自然等因素。C「組織內部的治理架構」屬於內部環境，非外部。"},{"id":"p3-q20","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"NIST CSF 2.0 的六大核心功能包括哪些？","options":["治理(Govern)","識別(Identify)","授權(Authorize)","偵測(Detect)"],"answer":"ABD","explanation":"CSF 2.0六大功能：治理(GV)、識別(ID)、保護(PR)、偵測(DE)、回應(RS)、復原(RC)。「授權」不是CSF的核心功能。"},{"id":"p3-q21","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"下列關於衝擊準則的敘述，何者正確？","options":["衝擊嚴重性通常分為普、中、高三個等級","衝擊可能包含營運受損與信譽損害","法律遵循性問題也屬於衝擊的一種","衝擊準則僅考量機密性遭破壞的程度"],"answer":"ABC","explanation":"D錯：衝擊準則需考量機密性、完整性及可用性三個面向遭破壞的程度，以及法律遵循性問題，而非僅考量機密性。"},{"id":"p3-q22","source":"part3 複選題模擬試題","chapter":"單元三｜資通安全風險管理","type":"multiple","question":"下列哪些是風險評鑑組織建議納入的成員？","options":["資訊部門/資安人員","人事部門","業務承辦人員","外部記者"],"answer":"ABC","explanation":"風險評鑑組織應跨部門組成：資訊部門/資安人員、總務部門、人事部門、會計部門、業務承辦人員等。外部記者不應參與內部風險評鑑。"},{"id":"p3-q23","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"A級公務機關的應辦事項包括下列哪些？","options":["核定後1年內完成資通系統分級與控制措施","核定後2年內導入ISMS","每年辦理2次內部稽核","每年至少4名人員持有資安專業證照"],"answer":"ABCD","explanation":"A級全部正確：分級+控制措施1年、ISMS導入2年（驗證3年）、內部稽核每年2次、證照至少4名。"},{"id":"p3-q24","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"下列關於 ISMS 的敘述，何者正確？","options":["A/B級須於3年內通過第三方驗證","C級僅需導入不需驗證","CNS 27001:2023 等同於 ISO/IEC 27001:2022","D/E級須於5年內導入"],"answer":"ABC","explanation":"D錯：D/E級對ISMS無任何要求（導入與驗證均未要求）。"},{"id":"p3-q25","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"CNS 27001:2023 附錄A的四大類控制措施包括？","options":["組織控制措施(37項)","人員控制措施(8項)","環境控制措施(20項)","技術控制措施(34項)"],"answer":"ABD","explanation":"C錯：正確為「實體控制措施(14項)」而非「環境控制措施(20項)」。四大類合計93項：A.5組織(37)+A.6人員(8)+A.7實體(14)+A.8技術(34)。"},{"id":"p3-q26","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"關於 BCP 三大時間指標，下列敘述何者正確？","options":["RPO 決定備份頻率","RTO 決定備援策略選擇","MTPD = RPO + RTO","備份週期不可大於 RPO"],"answer":"ABD","explanation":"C錯：正確公式為 MTPD = RTO + WRT（工作復原時間），非RPO+RTO。"},{"id":"p3-q27","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"關於資安治理成熟度評估，下列敘述何者正確？","options":["A級機關應達第3等級（制度化型）以上","成熟度評估僅適用於公務機關","A/B級每年辦理1次","成熟度計算採逐級檢查，最低構面能力度決定上限"],"answer":"ABCD","explanation":"全部正確。成熟度計算從Level 1往上逐級檢查，該級及以下所有流程構面能力度等級都要≥該級別數字，否則停在前一級。"},{"id":"p3-q28","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"下列哪些人員每年須接受至少3小時通識教育訓練？","options":["A級機關一般使用者","B級機關主管","C級機關資安專職人員","D級機關一般使用者"],"answer":"ABD","explanation":"C非最佳：資安專職人員要求每年12小時「專業訓練」（非3小時通識）。一般使用者及主管(A/B/C/D級)每年至少3小時通識教育。注意D級也要求通識。"},{"id":"p3-q29","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"關於三種稽核類型，下列敘述何者正確？","options":["第一方稽核是機關內部自我檢查","第二方稽核包括機關稽核委外廠商","第三方稽核依 CNS 27001 進行驗證","三種稽核的稽核範圍完全相同"],"answer":"ABC","explanation":"D錯：第一方稽核範圍為全機關、第二方稽核範圍為全機關或委外廠商、第三方稽核範圍為驗證範圍（不一定等於全機關）。"},{"id":"p3-q30","source":"part3 複選題模擬試題","chapter":"單元四｜管理面暨認知與訓練","type":"multiple","question":"成熟度等級 Level 1（基礎型）對應的流程構面包括？","options":["S1 資安政策與組織健全","M3 資安認知與教育訓練","T2 通訊與作業安全管理","T1 存取控制管理"],"answer":"ABC","explanation":"Level 1對應的流程構面：S1、M3、T2。T1存取控制管理對應的是Level 2。"},{"id":"p3-q31","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"single","question":"關於帳號管理，下列哪些為高等級資通系統的額外要求？（單選）","options":["閒置帳號應禁用","系統應自動登出逾時使用者","應持續監控帳號異常使用並回報","建立帳號申請、建立、修改等程序"],"answer":"C","explanation":"A（閒置帳號禁用）為普等級即有的要求。D（建立帳號管理程序）為普等級即有的要求。B（自動登出）為中級要求，C（監控異常使用並回報）才是高等級額外要求。"},{"id":"p3-q32","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"存取控制之授權原則包括哪些？","options":["業務僅知原則(Need-to-Know)","最小權限原則(Least Privilege)","職務區隔(Separation of Duties)","完整備份原則"],"answer":"ABC","explanation":"四大授權原則：業務僅知、最小權限、職務區隔、特殊權限管理。「完整備份原則」屬於營運持續計畫，非存取控制授權原則。"},{"id":"p3-q33","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"關於日誌記錄，下列敘述何者正確？","options":["日誌至少保留6個月","日誌應包含事件類型、發生時間、發生位置及使用者身分","高等級系統應定期備份日誌至原系統外","日誌格式可依各系統自行決定無需統一"],"answer":"ABC","explanation":"D錯：應採用「單一日誌機制」確保輸出格式的一致性，而非各系統自行決定。"},{"id":"p3-q34","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"關於系統備份，下列敘述何者正確？","options":["高等級應在不同地點進行異地備份","異地備援機房距離建議30公里以上","普等級僅需訂定RPO及執行源碼與資料備份","僅刪除檔案指標即可安全清除HDD資料"],"answer":"ABC","explanation":"D錯：僅刪除檔案指標或格式化不夠安全，HDD應以覆寫方式（如全零覆寫）進行安全刪除。"},{"id":"p3-q35","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"關於身分驗證管理，普等級即要求的控制措施包括？","options":["預設密碼登入後應立即變更","身分驗證資訊不以明文傳輸","帳號驗證失敗5次後至少15分鐘不允許登入","採取多重認證技術(MFA)"],"answer":"ABC","explanation":"D錯：多重認證技術(MFA)為「高等級」才有的額外要求。A/B/C在普等級即已要求。"},{"id":"p3-q36","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"關於雜湊函式(Hash)的特性與應用，下列何者正確？","options":["固定長度輸出","單向性（不可逆）","可用於驗證資料完整性","Salt 技術可強化密碼儲存安全"],"answer":"ABCD","explanation":"全部正確。雜湊的固定長度、單向性、完整性驗證都是核心特性。Salt結合密碼再雜湊，可防禦彩虹表攻擊及碰撞攻擊。"},{"id":"p3-q37","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"下列關於備份方式的比較，何者正確？","options":["差異備份是備份自上次完整備份後的變更","增量備份是備份自上次任何備份後的變更","增量備份的還原過程最複雜","完整備份的還原最省時"],"answer":"ABCD","explanation":"全部正確。差異=自上次完整備份後變更；增量=自上次任何備份後變更。增量還原需依序套用所有增量，最複雜。完整備份還原最單純但佔用空間最大。"},{"id":"p3-q38","source":"part3 複選題模擬試題","chapter":"單元五｜資通系統防護控制措施","type":"multiple","question":"防護基準七大構面中，「系統與服務獲得」構面包含哪些控制措施？","options":["SSDLC需求階段","SSDLC測試階段","帳號管理","系統文件"],"answer":"ABD","explanation":"系統與服務獲得(8項)：SSDLC各階段（需求/設計/開發/測試/部署維運/委外）+獲得程序+系統文件。帳號管理屬於存取控制構面。"},{"id":"p3-q39","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"下列何者屬於惡意程式？","options":["蠕蟲(Worm)","後門程式(Backdoor)","防火牆(Firewall)","木馬程式(Trojan Horse)"],"answer":"ABD","explanation":"五大惡意程式：病毒、蠕蟲、間諜軟體、後門程式、木馬程式。防火牆是安全防護設備，不是惡意程式。"},{"id":"p3-q40","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"防毒軟體的多層次部署方式包括？","options":["個人電腦與伺服器防毒","電子郵件防毒閘道（DMZ）","上網防毒閘道","入侵偵測系統(IDS)"],"answer":"ABC","explanation":"防毒軟體三層部署：個人電腦/伺服器→電子郵件防毒閘道(DMZ的SMTP AntiVirus)→上網防毒閘道(HTTP/FTP/POP3 AntiVirus)。IDS是獨立的入侵偵測系統，非防毒軟體部署。"},{"id":"p3-q41","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"下列關於 IDS 與 IPS 的敘述，何者正確？","options":["IDS 採旁路監聽(Mirror)部署","IPS 採串聯(Inline)部署","IDS 可自動阻擋攻擊","特徵比對可偵測已知攻擊，異常偵測可偵測偏離基準的行為"],"answer":"ABD","explanation":"C錯：IDS僅被動偵測並通報（發警報），不能自動阻擋。自動阻擋是IPS的功能。"},{"id":"p3-q42","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"APT（進階持續性威脅）攻擊的特色包括？","options":["針對性","持續性","隱匿性","隨機性"],"answer":"ABC","explanation":"APT特色：針對性（鎖定特定目標）、持續性（長期潛伏）、隱匿性（難以偵測）、多階段攻擊。APT不具隨機性，它是高度有計畫的攻擊。"},{"id":"p3-q43","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"EDR（端點偵測及回應系統）使用的技術包括？","options":["行為分析","規則比對","黑白名單","負載平衡"],"answer":"ABC","explanation":"EDR三大技術：行為分析、規則比對、黑白名單。負載平衡是可用性保護措施，與EDR無關。"},{"id":"p3-q44","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"NGFW（次世代防火牆）整合的功能包括？","options":["封包過濾","IPS入侵防禦","應用程式辨識","SSL解密"],"answer":"ABCD","explanation":"NGFW整合多功能：封包過濾+IPS+應用程式辨識+SSL解密+威脅情資，提供全面防護。全部正確。"},{"id":"p3-q45","source":"part3 複選題模擬試題","chapter":"單元六｜技術面 — 防護及偵測","type":"multiple","question":"VANS（政府機關資安弱點通報機制）的資訊資產涵蓋範圍包括？","options":["應用系統","應用程式中介軟體(Middleware)","作業系統","實體門禁系統"],"answer":"ABC","explanation":"VANS涵蓋四層：應用系統、中介軟體(如IIS、Tomcat)、作業系統、網路設備（含韌體）。實體門禁系統不在VANS範圍。"},{"id":"p3-q46","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"依 OWASP Top 10:2021，下列何者為其中的弱點類別？","options":["權限控制失效(Broken Access Control)","注入式攻擊(Injection)","伺服器端請求偽造(SSRF)","緩衝區溢位(Buffer Overflow)"],"answer":"ABC","explanation":"OWASP Top 10:2021包含A01權限控制失效、A03注入式攻擊、A10 SSRF等。緩衝區溢位不在Top 10:2021清單中。"},{"id":"p3-q47","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"關於弱點掃描與滲透測試的比較，下列何者正確？","options":["弱點掃描使用自動化工具進行非侵入式檢查","滲透測試會模擬攻擊者實際利用漏洞","A級機關弱點掃描每年2次","B級機關滲透測試每年1次"],"answer":"ABC","explanation":"D錯：B級滲透測試為每2年1次（非每年1次）。A級才是每年1次滲透測試。"},{"id":"p3-q48","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"資通安全健診的項目包括？","options":["網路架構檢視","使用者端電腦檢視","防火牆連線設定檢視","原始碼審查"],"answer":"ABC","explanation":"D錯：原始碼審查屬於應用程式安全檢測（SAST），不在健診六大項目中。健診六項：網路架構、網路惡意活動、使用者端電腦、伺服器主機、目錄伺服器設定、防火牆連線設定。"},{"id":"p3-q49","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"關於滲透測試的類型，下列敘述何者正確？","options":["黑箱測試不提供任何系統資訊","白箱測試提供完整系統資訊","灰箱測試介於黑白箱之間","黑箱測試的準確度最高"],"answer":"ABC","explanation":"D錯：白箱測試因擁有完整資訊，能更深入地發現弱點，準確度通常最高。黑箱測試模擬真實攻擊情境但可能遺漏內部弱點。"},{"id":"p3-q50","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"關於火災分類，下列配對何者正確？","options":["A類（普通火災）：木材、紙張、衣服","B類（油類火災）：石油、溶劑、酒精","C類（電氣火災）：可用水滅火","D類（金屬火災）：使用特殊乾粉"],"answer":"ABD","explanation":"C錯：C類電氣火災絕不可用水滅火（會導致觸電及設備損壞），應使用BC/ABC類乾粉、CO2或FM-200。"},{"id":"p3-q51","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"機房實體安全的措施包括？","options":["部署漏水偵測器於高架地板下及天花板","使用氣體滅火系統（如FM-200）而非灑水系統","門禁卡及生物辨識進出控管","將伺服器放置在開放辦公區域"],"answer":"ABC","explanation":"D錯：關鍵設備應置於安全區域（如機房），由適當安全屏障與進出控制保護，不應放在開放辦公區域。"},{"id":"p3-q52","source":"part3 複選題模擬試題","chapter":"單元七｜安全性檢測及資通安全健診","type":"multiple","question":"弱點掃描的目的包括？","options":["評估資安防護能力","發現潛在弱點","提供改善建議","自動修補所有漏洞"],"answer":"ABC","explanation":"D錯：弱點掃描負責「發現」弱點並提供建議，但不會自動修補所有漏洞。修補需由管理人員依據報告進行。"},{"id":"p3-q53","source":"part3 複選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"multiple","question":"依施行細則第4條，委外辦理資通業務時應注意的事項包括？","options":["受託者應具備完善資安管理措施或通過第三方驗證","受託者應配置資安專業人員","委託關係終止時應確認資料返還或銷毀","受託者可自行決定是否複委託"],"answer":"ABC","explanation":"D錯：複委託須依施行細則第4條第3款規定，由委託機關決定是否允許、範圍及對象，受託者不可自行決定。"},{"id":"p3-q54","source":"part3 複選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"multiple","question":"資訊委外生命週期的正確階段排序包括哪些？","options":["計畫","招標","決標","履約管理"],"answer":"ABCD","explanation":"完整生命週期六階段：計畫→招標→決標→履約管理→驗收→保固。四個選項均為正確階段。"},{"id":"p3-q55","source":"part3 複選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"multiple","question":"關於資訊委外的風險管理，下列敘述何者正確？","options":["應在核准廠商存取內部設施前識別資安風險","委外後不需持續監督受託者","遠端維運存在未授權存取及資料外洩風險","稽核優先順序應綜合考量金額、核心系統及業務敏感性"],"answer":"ACD","explanation":"B錯：資安法第9條明確要求機關必須「持續監督受託者的資通安全維護情形」。委外後的監督是核心義務。"},{"id":"p3-q56","source":"part3 複選題模擬試題","chapter":"單元八｜資訊委外安全管理","type":"multiple","question":"招標階段的資安管理重點包括？","options":["RFP撰寫之完整度","評選準則中之資安要求符合度","將SSDLC納入招標文件","跳過資安要求以降低成本"],"answer":"ABC","explanation":"D錯：資安要求不可跳過。招標文件之RFP及契約書應依委外服務之資通系統等級，納入SSDLC各階段規定。"},{"id":"p3-q57","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"multiple","question":"下列關於資安事件分級的敘述，何者正確？","options":["共分為四級","第三、四級為重大事件","所有等級事件均應於1小時內通報","第一、二級事件應於72小時內復原"],"answer":"ABCD","explanation":"全部正確。事件分四級，3/4級為重大事件，所有等級均1小時內通報，1/2級72hr復原、3/4級36hr復原。"},{"id":"p3-q58","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"multiple","question":"資通安全演練的類型包括？","options":["社交工程演練（每半年1次）","通報應變演練（每年1次）","網路攻防演練（每年1次）","情境演練（每季1次）"],"answer":"ABC","explanation":"D錯：情境演練為「每年1次」（非每季1次）。四種演練：社交工程每半年1次，其餘三種（通報應變、網路攻防、情境）均為每年1次。"},{"id":"p3-q59","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"multiple","question":"關於數位鑑識，下列敘述何者正確？","options":["蒐集時應使用寫保護裝置(Write Blocker)","應計算雜湊值驗證證據完整性","監管鏈(Chain of Custody)追蹤證據全過程","數位證據不易遭竄改所以不需特別保護"],"answer":"ABC","explanation":"D錯：數位證據的特性恰恰是「脆弱易變、易遭竄改」，因此更需要特別保護（寫保護、雜湊驗證、監管鏈等）。"},{"id":"p3-q60","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"single","question":"事件處理六步驟的正確順序為？","options":["準備→偵測與分析→損害控制→根除→復原→後續處理","偵測與分析→準備→根除→損害控制→復原→後續處理","準備→損害控制→偵測與分析→復原→根除→後續處理","以上皆非"],"answer":"A","explanation":"正確順序：準備→偵測與分析→損害控制→根除→復原→後續處理。必須先「準備」再「偵測」，偵測後先「控制損害」再「根除」威脅。"},{"id":"p3-q61","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"multiple","question":"社交工程攻擊的手法包括？","options":["釣魚郵件","電話詐騙","尾隨進入(Tailgating)","SQL Injection"],"answer":"ABC","explanation":"SQL Injection是技術性的注入式攻擊（利用系統弱點），不屬於社交工程。社交工程以「人」為目標，利用人性弱點。其他手法還有肩窺、假冒身分等。"},{"id":"p3-q62","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"multiple","question":"資通安全事件調查報告應包含的內容有？","options":["事件發生時間","事件影響範圍及損害評估","根因分析","受影響人員的個人績效考核"],"answer":"ABC","explanation":"D錯：個人績效考核不是調查報告的內容。調查報告應包含：發生時間、影響範圍、損害評估、損害控制與復原歷程、調查與處理歷程、根因分析、防範措施、完成時程。"},{"id":"p3-q63","source":"part3 複選題模擬試題","chapter":"單元九｜資通安全事件通報及應變","type":"multiple","question":"關於第三、四級重大資通安全事件，下列敘述何者正確？","options":["應於2小時內完成等級審核","應於36小時內完成損害控制或復原","主管機關得召開會議研商並提供協助","主管機關可公告事件內容但須排除營業秘密"],"answer":"ABCD","explanation":"全部正確。第3/4級為重大事件：2hr審核、36hr復原、可召開會議、可公告（排除營業秘密及依法保密資訊）。"},{"id":"p4-q01","source":"part4 資安法模擬試題","chapter":"A. 立法目的與名詞定義","type":"single","year":"113","question":"關於中華民國「資通安全管理法」之條文內容，下列何項正確？","options":["為保障著作人著作權益，調和社會公共利益，促進國家文化發展","為保障營業秘密，維護產業倫理與競爭秩序，調和社會公共利益","為規範個人資料之蒐集、處理及利用，以避免人格權受侵害，並促進個人資料之合理利用","為積極推動國家資通安全政策，加速建構國家資通安全環境，以保障國家安全，維護社會公共利益"],"answer":"D","explanation":"資安法第 1 條。A = 著作權法、B = 營業秘密法、C = 個資法。"},{"id":"p4-q02","source":"part4 資安法模擬試題","chapter":"A. 立法目的與名詞定義","type":"single","year":"112","question":"關於資通安全管理法所定義「公務機關」的敘述，下列何者正確？","options":["依法行使公權力之軍事機關","依法行使公權力之中央機關、地方機構","依法行使公權力之情報機關","政府捐助並依法行使公權力之財團法人"],"answer":"B","explanation":"公務機關 = 中央、地方機關（構）或公法人。排除軍事與情報機關（114.9.24修訂，114.12.1發布資通安全法第3條）。D 是特定非公務機關。"},{"id":"p4-q03","source":"part4 資安法模擬試題","chapter":"B. 適用對象與法規判斷","type":"multiple","year":"111、112、113（反覆出現）","question":"Z 公司為台灣上市櫃公司（3C 零售商），營運據點遍及歐洲及台灣。下列哪些法規為該公司必須遵守之法令規範？","options":["個人資料保護法（中華民國）","上市上櫃公司資通安全管控指引（中華民國）","資通安全管理法（中華民國）","歐盟一般資料保護規則（GDPR）"],"answer":"ABD","explanation":"C 不選！一般民間上市櫃公司不是公務機關、也未被指定為特定非公務機關 → 不適用資安法。但須遵循金管會指引、GDPR（歐洲營運）、個資法。\n\n💡 解題提示：此概念 111、112、113 年反覆出現（上市企業、貨車租賃公司等），是固定陷阱。注意變化：若題目說公司是「特定非公務機關」，就要選資安法。看清題目的公司身分！"},{"id":"p4-q04","source":"part4 資安法模擬試題","chapter":"B. 適用對象與法規判斷","type":"single","year":"111","question":"關於公務機關未遵守資通安全管理法規定的敘述，下列何者正確？","options":["應依相關規定按次處新臺幣十萬元以上一百萬元以下罰鍰","應依相關規定按次處新臺幣三十萬元以上五百萬元以下罰鍰","應按其情節輕重，依相關規定予以懲戒或懲處","應依相關規定按次處新臺幣三萬元以上五十萬元以下罰鍰"],"answer":"C","explanation":"公務機關走懲戒/懲處（資通安全法第 28條，適用公務機關所屬人員辦理資通安全事項作業辦法），不罰錢。罰鍰只適用於特定非公務機關（資通安全法第 29、30、31 條）。"},{"id":"p4-q05","source":"part4 資安法模擬試題","chapter":"B. 適用對象與法規判斷","type":"single","year":"113","question":"某 A 級公務機關（辦理全國全民健康保險業務），對於法規遵循事項所應遵循之法律規範，下列何項較為合適？","options":["應遵循智慧財產權法以及資通安全管理法之規定","應遵循個人資料保護法以及資通安全管理法之規定","應遵循智慧財產權法以及個人資料保護法之規定","應遵循著作權法以及個人資料保護法之規定"],"answer":"B","explanation":"全民健保 = 大量個資 → 個資法；公務機關 → 資安法。兩者都要。"},{"id":"p4-q06","source":"part4 資安法模擬試題","chapter":"C. 責任等級分級","type":"single","year":"110、113","question":"關於資通安全責任等級分級辦法，下列敘述何者正確？","options":["資通安全管理法規範資通安全責任等級，分為 A 至 D 級","公務機關應每三年核定其所屬機關資通安全責任等級","公務機關其負責業務有涉及國家機密，其資通安全責任等級即為 A 級","各公務機關未維運自行或委外開發之資通系統者，其資通安全責任等級為 C 級"],"answer":"C","explanation":"涉及國家機密 = 直接 A 級（第 4 條第 1 款）。A 錯：是 A 至 E 級（五級）。B 錯：是由上級機關或主管機關核定。D 錯：未維運系統 = D 級。"},{"id":"p4-q07","source":"part4 資安法模擬試題","chapter":"C. 責任等級分級","type":"single","year
